<!DOCTYPE html>
<html lang="en" class="night page-check-in cal-day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>jasonbrewer.org</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
  :root {
    --dot: #f0f0f0;           /* the color under the dot, replaced live */
    --page: #000;             /* page background: black in night mode, the dot's color otherwise */
    --ink: #f0f0f0;           /* text: the dot's color in night mode, black or white otherwise */
    --line: #000;             /* dot outline: black or white by day, black in night mode */
    --tick-room: 0px;         /* how far ENERGY / MOOD move down when the axis numbers show */
    --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;   /* the page font */
    --lab-fs: 14px;           /* font size of ENERGY / MOOD, set by the script */
    --ui-fs: 1rem;            /* Settings and Calendar text: 16px, following the browser's text size setting */
    --hour-fs: 0.75rem;       /* timeline hour labels, S M T W T F S: 12px */
    --title-fs: 1.75rem;      /* the calendar's big title (the year, the month): 28px */
    --tap: 44px;              /* smallest height for anything you tap */
    --cap: 0.72;              /* capital-letter height as a fraction of the font size, measured by the script */
    --size: min(33.333vh, calc(100vw - 48px));   /* refined by the script */
    --cell: calc(var(--size) / 10);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no browser may enlarge text on its own */
  html, body {
    touch-action: pinch-zoom;   /* a finger pressed on the background can steer the dot */
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--page);
    overscroll-behavior: none;
  }
  /* away from the check-in page, fingers scroll as usual */
  :root:not(.page-check-in), :root:not(.page-check-in) body { touch-action: manipulation; }

  #field {
    position: fixed;
    left: calc(50% - var(--size) / 2);
    top: calc(50% - var(--size) / 2);
    width: var(--size);
    height: var(--size);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    cursor: pointer;
  }

  #field img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    clip-path: inset(var(--gw, 1px));   /* only inside the outer lines (which cover that band anyway), so it can never show past them */
  }

  /* 11 x 11 black lines, 1px each */
  #grid { position: absolute; inset: 0; pointer-events: none; }
  /* drawn so every line lands on whole physical pixels: equally thick and sharp at any zoom */
  #grid { width: 100%; height: 100%; overflow: visible; }
  #grid rect { fill: #000; shape-rendering: crispEdges; }

  #dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--cell);
    height: var(--cell);
    box-sizing: border-box;
    border: 2px solid var(--line);
    transition: border-color .15s;
    border-radius: 50%;
    background: var(--dot);
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
  }
  #dot.dragging { cursor: grabbing; }

  /* heading, numbers and labels: placed in pixels by the script */
  #text {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  #text text {
    font-family: var(--font);
    fill: var(--ink);
    transition: fill .15s;
    text-rendering: geometricPrecision;   /* exact glyph positions at any size */
  }
  #text text { font-weight: 400; text-anchor: start; }
  #text .lab { font-weight: 600; }
  #text .edge { font-weight: 400; }   /* the four labels around the grid */
  :root.no-grid-labels #text .edge { display: none; }
  :root.night #text text { transition: none; }   /* text keeps exact pace with the dot's color */

  /* The three switches. Their words are the size of ENERGY / MOOD in regular weight.
     Each toggle is sized in the words' own units (em), to exactly the height of their
     capital letters, and stands on the same baseline as the words. */
  .switch {
    --sw: calc(var(--cap) * 1em);
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    display: block;
    margin: 0; padding: calc((var(--tap) - 1em) / 2) 8px;
    border: 0; background: none; color: var(--ink);
    font: 400 var(--ui-fs)/1 var(--font);
    text-rendering: geometricPrecision;
    white-space: nowrap;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* NIGHT MODE: a row on the Settings page, its words on the left and its toggle on the right */
  /* Settings rows: words on the left, toggle on the right */
  .setting { display: flex; justify-content: space-between; align-items: baseline; right: auto; box-sizing: border-box; }
  :root:not(.page-settings) .setting { visibility: hidden; }
  .setting .words { font-weight: 600; }

  /* ---------- Settings: Schedule check-ins (interface only for now) ---------- */
  #sched-panel {
    position: fixed; left: 0; top: 0; height: 0; box-sizing: border-box;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    scrollbar-width: none; color: var(--ink); font-family: var(--font);
    user-select: none; -webkit-user-select: none; visibility: hidden;
    --line-w: calc(var(--icon) * 1.75 / 24);                 /* the nav icons' line */
    --knob: calc(var(--icon) * 20.25 / 24);                  /* as tall as the toggles */
  }
  #sched-panel::-webkit-scrollbar { display: none; }
  :root.page-settings.sched-on #sched-panel { visibility: visible; }
  #sched-panel button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #sched-panel button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 999px; }

  /* the three-position choice */
  .seg {
    display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tap); margin-top: 6px;
    border-radius: calc(var(--tap) / 2); box-shadow: inset 0 0 0 var(--line-w) currentColor;
  }
  .seg { position: relative; }
  /* the filled pill behind the chosen option; it slides from one to the next */
  .seg-thumb {
    position: absolute; top: 0; bottom: 0; left: 0; width: calc(100% / 3);
    border-radius: calc(var(--tap) / 2); background: var(--ink);
    transform: translateX(calc(var(--seg-i, 0) * 100%));
    transition: transform .3s cubic-bezier(.25, .8, .25, 1);   /* eases in, settles without overshooting the outline */
  }
  .seg button { position: relative; border-radius: calc(var(--tap) / 2); font: 600 var(--ui-fs)/1 var(--font) !important; transition: color .2s; }
  #sched-panel .seg button[aria-checked="true"] { color: var(--page); }
  @media (prefers-reduced-motion: reduce) { .seg-thumb, .seg button { transition: none; } }

  /* a titled slider */
  .field { margin-top: 28px; }
  .field[hidden] { display: none; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; font: 600 var(--ui-fs)/1 var(--font); }
  .field-value { font-weight: 400; }
  .slider { position: relative; height: var(--tap); margin-top: 6px; touch-action: none; cursor: pointer; }
  .rail, .fill { position: absolute; top: 50%; transform: translateY(-50%); background: currentColor; }
  /* the line and its step dots are faded together as one group, so where a dot sits on the line
     the two don't stack into a darker spot */
  .rail-group { position: absolute; inset: 0; opacity: .3; pointer-events: none; }
  .rail { left: calc(var(--knob) / 2); right: calc(var(--knob) / 2); height: var(--line-w); border-radius: calc(var(--line-w) / 2); }
  .fill { height: calc(var(--line-w) * 2); border-radius: var(--line-w); }            /* the line between the two handles */
  .stop { position: absolute; top: 50%; width: calc(var(--line-w) * 3); height: calc(var(--line-w) * 3); margin: calc(var(--line-w) * -1.5) 0 0 calc(var(--line-w) * -1.5); border-radius: 50%; background: currentColor; }   /* 3x the line's thickness */
  .slider .knob {
    position: absolute; top: 50%; width: var(--tap) !important; height: var(--tap);
    margin: calc(var(--tap) / -2) 0 0 calc(var(--tap) / -2) !important; border-radius: 50%;
    touch-action: none; cursor: grab;
  }
  .slider .knob::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: var(--knob); height: var(--knob); margin: calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);
    border-radius: 50%; background: currentColor;
  }
  .slider .knob.dragging { cursor: grabbing; }
  #sched-panel .slider .knob:focus, #sched-panel .slider .knob:focus-visible { outline: none; }   /* no halo around a handle in use */
  /* hour marks under the time range: centered on their points, the two ends kept inside the row */
  .ticks { position: relative; height: 1em; margin-top: 2px; font: 400 var(--hour-fs)/1 var(--font); opacity: .45; }
  .ticks span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .preview { margin-top: 10px; font: 400 var(--hour-fs)/1.5 var(--font); opacity: .45; }

  /* Custom: a list of times, each with its own toggle, and a pill to add one */
  #f-custom { margin-top: 20px; }
  #sched-panel .ci {
    position: relative; right: auto; display: flex; width: 100%;
    justify-content: space-between; align-items: baseline; box-sizing: border-box;
    padding: calc((var(--tap) - 1em) / 2) 0; font: 600 var(--ui-fs)/1 var(--font);
  }
  #sched-panel .ci .words { font-variant-numeric: tabular-nums; }
  #sched-panel .ci[aria-checked="false"] .words { opacity: .45; }
  #sched-panel .add { display: grid; place-items: center; width: 100%; height: var(--tap); margin-top: 4px; }
  #sched-panel .add[hidden] { display: none; }
  .add .pill {
    display: grid; place-items: center; width: 100%; height: var(--tap); box-sizing: border-box;   /* as tall as Frequency / Number / Custom */
    border-radius: calc(var(--tap) / 2); box-shadow: inset 0 0 0 var(--line-w) currentColor;
  }
  .add svg { width: var(--ui-fs); height: var(--ui-fs); overflow: visible; }   /* the + is the size of the words above */
  .add svg path { fill: none; stroke: currentColor; stroke-width: var(--line-w); stroke-linecap: round; vector-effect: non-scaling-stroke; }
  /* entering a new time: one full-width pill, like the + it replaces —
     the time and its clock on the left, cancel (X) and add (tick) on the right */
  .new-time {
    display: flex; align-items: center; height: var(--tap); margin-top: 4px; padding: 0 0 0 16px; box-sizing: border-box;
    border-radius: calc(var(--tap) / 2); box-shadow: inset 0 0 0 var(--line-w) currentColor;
  }
  .new-time[hidden] { display: none; }
  .new-time input {
    flex: none; width: auto; height: 100%; margin: 0; padding: 0; border: 0; background: none;
    color: inherit; font: 600 var(--ui-fs)/1 var(--font); font-variant-numeric: tabular-nums;
    color-scheme: light;
  }
  :root.night .new-time input { color-scheme: dark; }
  .new-time input:focus { outline: none; }   /* the outline keeps its weight while you type; the highlighted digits show where you are */
  .new-time input::-webkit-calendar-picker-indicator { display: none; }   /* our own clock sits beside the time instead */
  .new-time .gap { flex: 1; }
  #sched-panel .new-time button { display: grid; place-items: center; flex: none; height: var(--tap); }
  /* The clock, X and check are the same circle: 28px icons whose circle (r = 11 of 24) measures
     --ring across, line included. The check sits as far from the pill's line as it does above and
     below (--inset), and the X sits that same distance from the check. */
  .new-time { --ring: calc(28px * 22 / 24 + var(--line-w)); --inset: calc((var(--tap) - var(--ring)) / 2 - var(--line-w)); }
  #sched-panel .new-time .clock { width: var(--tap); margin-left: -4px; }
  /* Each button's tap area runs to the middle of the gap between them, so they never overlap.
     --edge-in: the sliver between a 28px icon's box and its circle. */
  .new-time { --edge-in: calc((28px - var(--ring)) / 2); --outside: calc((var(--tap) - var(--ring)) / 2 - var(--edge-in)); --half: calc(var(--inset) / 2 - var(--edge-in)); }
  #sched-panel .new-time .round { width: auto; }
  #sched-panel .new-time #new-time-cancel { padding: 0 var(--half) 0 var(--outside); }
  #sched-panel .new-time #new-time-add { padding: 0 var(--outside) 0 var(--half); }
  .new-time svg { overflow: visible; }
  .new-time svg * { fill: none; stroke: currentColor; stroke-width: var(--line-w); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .new-time .clock svg, .new-time .round svg { width: 28px; height: 28px; }
  #sched-panel .new-time button:focus-visible { outline: 2px solid currentColor; outline-offset: -6px; }

  /* ---------- Calendar: Year, Month and Day ---------- */
  .calv {
    position: fixed; left: 0; right: 0; top: 0; height: 0; visibility: hidden;
    color: var(--ink); font-family: var(--font);
    user-select: none; -webkit-user-select: none;
  }
  :root.page-calendar.cal-year #cal-year,
  :root.page-calendar.cal-month #cal-month, :root.page-calendar.cal-month #cal-month-head,
  :root.page-calendar.cal-day #cal-day-head, :root.page-calendar.cal-week #cal-week-head { visibility: visible; }
  .cal-scroll {
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    touch-action: pan-y; scrollbar-width: none;
  }
  .cal-scroll::-webkit-scrollbar { display: none; }
  .calv button {
    margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit;
    text-align: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .calv button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 6px; }
  /* the big title: the year, or the month */
  .calv .cal-title { display: block; margin: 0; min-height: 1em; font: 600 var(--title-fs)/1 var(--font); letter-spacing: -0.01em; }
  /* S M T W T F S */
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); font: 600 var(--hour-fs)/1 var(--font); opacity: .45; text-align: center; }
  .today-mark { background: var(--ink); color: var(--page) !important; border-radius: 50%; font-weight: 600 !important; opacity: 1 !important; }

  /* Year: 12 month blocks per year, sized so one year fits the screen */
  .yr { padding-bottom: var(--ygapy); }
  .yr .cal-title { padding: 0 0 var(--ytitle-gap); }
  .yr-grid { display: grid; grid-template-columns: repeat(var(--ycols), var(--yblock)); column-gap: var(--ygapx); row-gap: var(--ygapy); }
  .mb { display: block; width: var(--yblock); }
  .mb-name { display: block; font: 600 calc(var(--ycell) * 0.95)/1 var(--font); height: var(--yname, calc(var(--ycell) * 1.4)); }
  .mb-days { display: grid; grid-template-columns: repeat(7, var(--ycell)); grid-auto-rows: var(--ycell); height: calc(var(--ycell) * 6);
             font: 400 calc(var(--ycell) * 0.6)/1 var(--font); }
  .mb-days i { font-style: normal; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .mb-days i.today-mark { width: calc(var(--ycell) * 0.95); height: calc(var(--ycell) * 0.95); margin: auto; }
  /* a day with check-ins: its whole tile takes their average color, the number in black or white */
  .mb-days i.tiled, .mo button.tiled { color: var(--tile-ink);
    background: linear-gradient(var(--tile), var(--tile)) 0 0 / calc(100% - var(--gw, 1px)) calc(100% - var(--gw, 1px)) no-repeat; }   /* a gridline-thin gap to the right of and below each tile, on whole pixels */
  /* today's circle on a colored tile: black or white, whichever stands out, with the number in the tile's color */
  .mb-days i.today-mark.tiled { width: auto; height: auto; margin: 0; border-radius: 0; color: var(--tile) !important;
    background: radial-gradient(circle closest-side, var(--tile-ink) calc(95% - 0.5px), transparent calc(95% + 0.5px)),
                linear-gradient(var(--tile), var(--tile)) 0 0 / calc(100% - var(--gw, 1px)) calc(100% - var(--gw, 1px)) no-repeat; }
  .mo button.tiled .today-mark { background: var(--tile-ink); color: var(--tile) !important; }

  /* Month: months one after another, each month's name above its 1st */
  #cal-month-head .wk { grid-template-columns: repeat(7, var(--mcol, 1fr)); }
  .mo { display: grid; grid-template-columns: repeat(7, var(--mcol, 1fr)); grid-template-rows: var(--mlabel); grid-auto-rows: var(--mrow); }
  .mo-label { grid-row: 1; height: var(--mlabel); box-sizing: border-box; align-self: stretch; display: flex; align-items: center; justify-content: center; font: 600 var(--ui-fs)/1 var(--font); }   /* centered in its row, like the dates in theirs, so it sits halfway between them */
  .mo button { display: grid; place-items: center; font: 400 var(--ui-fs)/1 var(--font); font-variant-numeric: tabular-nums; }
  .mo button span { display: grid; place-items: center; width: var(--mcircle); height: var(--mcircle); }
  .mo .first-row { grid-row: 2; }
  .mo-pad { grid-row: 1; }

  /* Day: the week strip and the date line above the timeline */
  #cal-day-head { touch-action: pan-y; }
  .strip { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 10px; }
  /* one circle behind the chosen date; it glides from date to date */
  .strip-dot {
    position: absolute; left: 0; top: 0; width: calc(100% / 7); height: 44px; pointer-events: none;
    transform: translateX(calc(var(--strip-i, 0) * 100%));
    transition: transform .3s cubic-bezier(.25, .8, .25, 1);
  }
  .strip-dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: var(--ink); }
  .strip.no-glide .strip-dot { transition: none; }
  .strip button { position: relative; display: grid; place-items: center; height: 44px; font: 400 var(--ui-fs)/1 var(--font); font-variant-numeric: tabular-nums; transition: color .1s; }
  .strip button span { display: grid; place-items: center; width: 36px; height: 36px; }
  .calv .strip button.sel { color: var(--page); font-weight: 600; transition: color .12s ease .18s; }   /* turns as the circle lands, not before */
  .strip button.today:not(.sel) span { font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .strip-dot, .strip button { transition: none; } }
  /* the back bar along the top: empty in Year, "‹ 2026" in Month, "‹ October" in Day */
  #cal-back {
    position: fixed; left: 0; right: auto; top: 0; width: auto; height: var(--tap); margin: 0; padding: 0 8px; visibility: hidden;
    border: 0; border-radius: calc(var(--tap) / 2); background: none; color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 4px; font: 600 var(--ui-fs)/1 var(--font);
  }
  :root.page-calendar.cal-month #cal-back, :root.page-calendar.cal-week #cal-back, :root.page-calendar.cal-day #cal-back,
  :root.page-calendar.cal-entry #cal-back { visibility: visible; }
  #day rect.pill { cursor: pointer; }

  /* ---------- a check-in, opened from Day view: the check-in page's look, with a note ---------- */
  #review {
    position: fixed; left: 0; right: 0; top: 0; height: 0; visibility: hidden;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none;
    color: var(--ink); font-family: var(--font);
  }
  #review::-webkit-scrollbar { display: none; }
  :root.page-calendar.cal-entry #review { visibility: visible; }
  #rv-inner { position: relative; width: 100%; }
  /* the date and time: the Year / Month title's size and place; a long one wraps, its first line
     kept exactly where a one-line title sits */
  #rv-head { position: absolute; margin: -0.075em 0 0; text-align: left; font: 600 var(--title-fs)/1.15 var(--font); letter-spacing: -0.01em; white-space: pre-line; user-select: none; -webkit-user-select: none; }
  #rv-text { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #rv-text text { font-family: var(--font); fill: var(--ink); text-rendering: geometricPrecision; font-weight: 400; }
  #rv-text .lab { font-weight: 600; }
  :root.no-grid-labels #rv-text .edge { display: none; }
  #rv-field { position: absolute; user-select: none; -webkit-user-select: none; }
  #rv-field img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; clip-path: inset(var(--gw, 1px)); }   /* only inside the outer lines, so it can never show past them */
  #rv-grid { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #rv-grid rect { fill: #000; shape-rendering: crispEdges; }
  #rv-dot { position: absolute; box-sizing: border-box; border: 2px solid var(--line); border-radius: 50%; transform: translate(-50%, -50%); }
  #rv-note {
    position: absolute; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden;
    background: none; color: var(--ink); caret-color: var(--ink); text-align: left;   /* starts at the grid's left edge */
    font-family: var(--font); font-weight: 400; line-height: 1.25;
  }
  #rv-note::placeholder { color: var(--ink); opacity: .45; }   /* the dimness of the nav's other icons */
  #rv-note:focus::placeholder { color: transparent; }           /* tapped: just the cursor */
  #cal-back:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  #cal-back svg { width: var(--ui-fs); height: var(--ui-fs); margin-left: -3px; overflow: visible; }
  #cal-back path { fill: none; stroke: currentColor; stroke-width: calc(var(--icon) * 1.75 / 24); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  /* the week's title: the Year / Month title style; a long range wraps, with the first line
     kept exactly where a one-line title sits */
  #week-line.cal-title, #day-line.cal-title { line-height: 1.15; margin-top: -0.075em; text-wrap: balance; }
  @keyframes from-right { from { transform: translateX(28px); opacity: 0; } }
  @keyframes from-left  { from { transform: translateX(-28px); opacity: 0; } }
  .slide-next { animation: from-right .22s ease-out; }
  .slide-prev { animation: from-left .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .slide-next, .slide-prev { animation: none; } }

  /* Day: a scrolling timeline, midnight to midnight, between the views row and the nav */
  #day, #week {
    position: fixed; left: 0; right: 0; top: 0; height: 0;
    overflow-x: hidden; overflow-y: auto;
    overscroll-behavior: contain; touch-action: pan-y;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
            mask-image: linear-gradient(transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
  }
  #day::-webkit-scrollbar, #week::-webkit-scrollbar { display: none; }
  :root:not(.page-calendar) #day, :root:not(.cal-day) #day,
  :root:not(.page-calendar) #week, :root:not(.cal-week) #week { visibility: hidden; }
  #day svg, #week svg { display: block; width: 100%; overflow: visible; }
  #week .band { fill: transparent; cursor: pointer; }        /* tap a day to open it */
  #day text, #week text {

    text-rendering: geometricPrecision;

  #day rect, #week rect { fill: var(--ink); fill-opacity: .2; }
  #week rect.band { fill-opacity: 0; }
  /* a committed check-in: a pill in its chosen color with a black outline */
  #day rect.pill, #week rect.pill { fill-opacity: 1; stroke: none; }
  .switch:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; border-radius: 6px; }
  /* The toggle matches the nav icons: as tall as the Check-in icon's circle (20.25 of its
     24 units, outside edge to outside edge) and drawn with the icons' line (1.75 units). */
  .switch .track {
    --th: calc(var(--icon) * 20.25 / 24);             /* toggle height */
    --tb: calc(var(--icon) * 1.75 / 24);              /* line thickness */
    --td: calc(var(--th) * 0.5);                      /* thumb diameter */
    --tg: calc((var(--th) - 2 * var(--tb) - var(--td)) / 2);   /* even gap around the thumb */
    display: inline-block; vertical-align: baseline;   /* an empty inline block sits exactly on the text baseline */
    position: relative; flex: none;
    height: var(--th); width: calc(var(--th) * 1.75); box-sizing: border-box;
    border-radius: calc(var(--th) / 2);                 /* a pure pill: straight sides, semicircle ends */
    box-shadow: inset 0 0 0 var(--tb) currentColor;   /* the outline; browsers round real borders to whole pixels */
    /* from the baseline, move down so the toggle's middle is level with the middle of the capitals */
    transform: translateY(calc(var(--th) / 2 - var(--sw) / 2));
  }
  .switch .thumb {
    position: absolute; top: 50%; left: calc(var(--tb) + var(--tg));
    width: var(--td); height: var(--td); border-radius: 50%;
    background: currentColor;
    transform: translateY(-50%);

  /* the key: axis numbers 0-10 beside and below the square, each with a small tick mark */
  #ticks { display: none; }
  #ticks rect { fill: var(--ink); }
  /* the square's bottom-left corner pixel, drawn over the black grid in the ticks' color so the
     two zero ticks meet in an unbroken right angle */
  #corner { display: none; position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; background: var(--ink); }
  :root.ticks #corner { display: block; }
  :root.ticks #ticks { display: inline; }

  /* the big numbers and their labels step down to make room, and back up again */
  #block { transition: transform .6s cubic-bezier(.3, 1.9, .5, 1); }
  @supports (transition-timing-function: linear(0, 1)) {
    #block { transition-timing-function: linear(0, 0.35 12%, 0.75 24%, 1.02 34%, 1.13 44%, 1.14 50%, 1.09 60%, 1.02 70%, 0.985 80%, 0.99 90%, 1); }
  }
  :root.ticks #block { transform: translateY(var(--tick-room)); }
  @media (prefers-reduced-motion: reduce) { #block { transition: none; } }

  /* ---------- commit: the circled arrow that saves a check-in ---------- */
  #commit {
    position: fixed; left: 0; top: 0; width: var(--tap); height: var(--tap);   /* placed by the script */
    display: grid; place-items: center;
    margin: 0; padding: 0; border: 0; border-radius: 50%; background: none;
    color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    opacity: 0; transform: scale(.85); pointer-events: none;
    transition: opacity .2s, transform .2s cubic-bezier(.3, 1.6, .5, 1);

  :root:not(.page-check-in) #commit { visibility: hidden; }

  #commit svg * {
    fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round;
    stroke-width: calc(var(--icon) * 1.75 / 24);              /* the nav icons' line */
    vector-effect: non-scaling-stroke;
  }
  #commit .tick { opacity: 0; }
  #commit.done .arrow { opacity: 0; }
  #commit.done .tick { opacity: 1; }
  #commit:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { #commit { transition: opacity .2s; } }

  /* ---------- pages and the bottom nav ---------- */
  :root { --nav-h: 64px; --icon: 26px; --nav-icon: calc(var(--icon) * 1.5); }   /* --icon sizes the toggles and line weights; the nav icons are 1.5x that */
  :root:not(.page-check-in) #text,
  :root:not(.page-check-in) #field { visibility: hidden; }

  #nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: var(--nav-h);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    display: flex; justify-content: center; align-items: center;

    fill: none; stroke: currentColor;
    stroke-width: calc(var(--icon) * 1.75 / 24);   /* the same line as the toggles and sliders, at any icon size */
    stroke-linecap: round; stroke-linejoin: round;

<script>
(function () {
  var root  = document.documentElement;
  var field = document.getElementById('field');
  var grid  = document.getElementById('grid');
  var dot   = document.getElementById('dot');
  var safe  = document.getElementById('safe');
  var img   = document.getElementById('src');
  var theme = document.querySelector('meta[name="theme-color"]');

  var CELLS = 10;
  var fx = 0.5, fy = 0.5;      // dot position as a fraction of the field
  var pixels = null, pw = 0, ph = 0;

  /* ---------- grid lines ---------- */
  var lines = [];
  for (var n = 0; n <= CELLS; n++) {
    var v = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    var h = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    grid.appendChild(v); grid.appendChild(h);
    lines.push([v, h]);
  }

  /* ---------- text ---------- */
  // the page font: the stack used for both drawing and measuring
  var FAMILY = '"Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  var TITLE = 'How are you feeling?';
  var tTitle  = document.getElementById('t-title');
  var commitBtn = document.getElementById('commit');
  var SITE_SPACE = 'jasonbrewer.org';   // the site name is gone; its old size still sets the spacing above the heading

  // axis numbers: 0-10 up the left side (0 at the bottom) and 0-10 along the bottom (0 at the left)
  var ticksG = document.getElementById('ticks'), ticksV = [], ticksH = [], marksV = [], marksH = [];
  var axisV = document.createElementNS('http://www.w3.org/2000/svg', 'text');   // ENERGY, reading bottom to top
  var axisH = document.createElementNS('http://www.w3.org/2000/svg', 'text');   // MOOD
  axisV.textContent = 'ENERGY'; axisH.textContent = 'MOOD';
  ticksG.appendChild(axisV); ticksG.appendChild(axisH);
  for (var v = 0; v <= 10; v++) {
    [ticksV, ticksH].forEach(function (set) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.textContent = String(v);
      ticksG.appendChild(el);
      set.push(el);
    });
    [marksV, marksH].forEach(function (set) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      ticksG.appendChild(el);
      set.push(el);
    });
  }
  var nMood   = document.getElementById('n-mood');
  var nEnergy = document.getElementById('n-energy');
  var lMood   = document.getElementById('l-mood');
  var lEnergy = document.getElementById('l-energy');
  var mctx = document.createElement('canvas').getContext('2d');

  // Ink metrics of a string, as fractions of the font size.
  function measure(text, weight) {
    mctx.font = weight + ' 100px ' + FAMILY;
    var m = mctx.measureText(text);
    return {
      left:  m.actualBoundingBoxLeft / 100,     // ink left of the origin
      right: m.actualBoundingBoxRight / 100,    // ink right of the origin
      asc:   m.actualBoundingBoxAscent / 100,   // ink above the baseline
      desc:  m.actualBoundingBoxDescent / 100,  // ink below the baseline
      adv:   m.width / 100
    };
  }
  function place(el, x, y, fontSize) {
    el.setAttribute('x', x);
    el.setAttribute('y', y);
    el.style.fontSize = fontSize + 'px';
  }

  // geometry shared by layoutText() and placeNumbers()
  var num = { cL: 0, cR: 0, base: 0, fs: 0, labBase: 0, labFs: 0 };

  // place a string so its ink is centered on x = c
  function centered(el, weight, c, y, fs) {
    var m = measure(el.textContent, weight);
    place(el, c - (m.right - m.left) * fs / 2, y, fs);
  }

  // Each number is centered on a fixed point, with its label centered beneath,
  // so nothing shifts when a number goes between one and two digits.
  function placeNumbers() {
    centered(nEnergy, 400, num.cL, num.base, num.fs);         // energy on the left
    centered(nMood,   400, num.cR, num.base, num.fs);         // mood on the right
    centered(lEnergy, 600, num.cL, num.labBase, num.labFs);
    centered(lMood,   600, num.cR, num.labBase, num.labFs);
  }

  // mobile: 0 = desktop arrangement, 1 = mobile arrangement, in between while the window changes shape.
  // edgeTop / edgeBottom: the usable top and bottom of the screen.
  // side: for short, wide screens (a phone on its side), the x where the column beside the
  // square starts; the heading and the numbers then stack in that column instead of above
  // and below the square. null otherwise.
  function layoutText(left, top, size, mobile, edgeTop, edgeBottom, edgeLeft, side, commitGeo) {
    // Reference unit: the heading's font size if it spanned the full square.
    var t = measure(TITLE, 400);
    var fs1 = size / (t.left + t.right);
    var textH = (t.asc + t.desc) * fs1;
    var digits = measure('0123456789', 400);
    var digitH = digits.asc + digits.desc;

    var h = t;                    // the heading is regular weight
    var fsT = size / (h.left + h.right);                         // heading: as wide as the square
    var fsSite = fs1 * (7 / 8) * 0.75;                           // site name: its size is unchanged
    var fsN = 2 * ((size - GW) / CELLS) / digitH;   // numbers: their digits exactly two grid cells tall
    var fsL = parseFloat(getComputedStyle(root).fontSize) || 16;   // ENERGY / MOOD: 1rem, the size of the Settings rows

    function mix(a, b) { return a + (b - a) * mobile; }
    var bottom = top + size;
    var base = 2 * textH + digitH * fs1;

    // Labels around the grid: 2/3 the size of ENERGY / MOOD, regular weight, each one its own
    // height away from the grid's edge. The left one reads bottom to top, the right one top to bottom.
    var fsE = fsL * 2 / 3;
    var eInk = measure('HIGHLOWENERGYNEGATIVEPOSITIVEMOOD', 400);   // one shared height, so all four match
    var eH = (eInk.asc + eInk.desc) * fsE, eGap = 1.5 * eH;
    var cxSq = left + size / 2, cySq = top + size / 2, rightSq = left + size;
    centered(document.getElementById('e-top'), 400, cxSq, top - eGap - eInk.desc * fsE, fsE);
    centered(document.getElementById('e-bottom'), 400, cxSq, bottom + eGap + eInk.asc * fsE, fsE);
    (function () {
      var el = document.getElementById('e-left'), m = measure(el.textContent, 400);
      var bx = left - eGap - eInk.desc * fsE, by = cySq + (m.right - m.left) * fsE / 2;
      place(el, bx, by, fsE); el.setAttribute('transform', 'rotate(-90 ' + bx + ' ' + by + ')');
      el = document.getElementById('e-right'); m = measure(el.textContent, 400);
      bx = rightSq + eGap + eInk.desc * fsE; by = cySq - (m.right - m.left) * fsE / 2;
      place(el, bx, by, fsE); el.setAttribute('transform', 'rotate(90 ' + bx + ' ' + by + ')');
    })();
    var topLabelInk = top - eGap - eH, bottomLabelInk = bottom + eGap + eH;
    if (!gridLabels) { topLabelInk = top; bottomLabelInk = bottom; }   // labels hidden: space against the grid itself

    // Heading, centered over the square. Its letters (top of the capitals to the bottom of
    // the y and g) sit halfway between the bottom of the commit button's circle and the top
    // of HIGH ENERGY.
    var titleW = (h.left + h.right) * fsT;
    var above = commitGeo ? commitGeo.bottom : edgeTop;
    var centerY = (above + topLabelInk) / 2;
    var titleX = left + (size - titleW) / 2 + h.left * fsT;
    if (!side) place(tTitle, titleX, centerY + (h.asc - h.desc) * fsT / 2, fsT);

    // Axis numbers: regular weight, 2/3 the size of ENERGY / MOOD, set 2/3 as far
    // from the square as before.
    var pitch = (size - 1) / CELLS;
    var fsK = fsL * 2 / 3;
    var zero = measure('0', 400);
    var clear = (pitch / 2 + fsL * 0.35) * 2 / 3;
    var widest = measure('10', 400);

    var i = Math.floor((e.clientY - r.top - weekGeo.inset) / weekGeo.band);
    if (i < 0 || i > 6) return;
    selDate = new Date(weekStart); selDate.setDate(weekStart.getDate() + i);
    setLevel('day');
  });
  function changeWeek(step) {
    var d = new Date(weekStart); d.setDate(weekStart.getDate() + 7 * step);
    if (d.getFullYear() < Y0 || d.getFullYear() > Y1) return;
    weekStart = d;
    renderWeekLine();
    placeWeek();                                         // the title may now take one line or two
    updateBack();
    [weekHead, weekBox].forEach(function (el) {
      el.classList.remove('slide-next', 'slide-prev'); void el.offsetWidth;
      el.classList.add(step > 0 ? 'slide-next' : 'slide-prev');
    });
  }
  // swipe left for the next week, right for the week before
  var weekSwipe = null, weekSwiped = false;
  [weekHead, weekBox].forEach(function (el) {
    el.addEventListener('pointerdown', function (e) { weekSwipe = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
    el.addEventListener('pointerup', function (e) {
      if (!weekSwipe || e.pointerId !== weekSwipe.id) return;
      var dx = e.clientX - weekSwipe.x, dy = e.clientY - weekSwipe.y;
      weekSwipe = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > 2 * Math.abs(dy)) {
        changeWeek(dx < 0 ? 1 : -1);
        weekSwiped = true; setTimeout(function () { weekSwiped = false; }, 0);
      }
    });
    el.addEventListener('pointercancel', function () { weekSwipe = null; });
  });

  /* ---------- a check-in, opened from Day view ---------- */
  var reviewBox = document.getElementById('review'), rvInner = document.getElementById('rv-inner');
  var rvHead = document.getElementById('rv-head'), rvField = document.getElementById('rv-field');
  var rvGrid = document.getElementById('rv-grid'), rvDot = document.getElementById('rv-dot');
  var rvNote = document.getElementById('rv-note'), rvGeo = null, rvTitle = { date: '', time: '' };
  // tap a check-in in Day view to open it
  dayBox.addEventListener('click', function (e) {
    var pill = e.target.closest && e.target.closest('rect.pill');
    if (!pill || swiped || justPinched()) return;
    var t = +pill.getAttribute('data-t');
    var c = checkins.filter(function (x) { return x.t === t; })[0];
    if (c) openReview(c);
  });
  function openReview(c) {
    reviewEntry = c;
    rvNote.value = c.note || '';
    var d = new Date(c.t);
    // "Tuesday, Oct 27, 2026 · 2:30 PM": when it wraps, the time moves down whole and "Oct 27" never splits
    var NB = '\u00a0';
    var dateTxt = d.toLocaleDateString('en-US', { weekday: 'long' }) + ', ' + MON[d.getMonth()] + NB + d.getDate() + ', ' + d.getFullYear();
    rvTitle = { date: dateTxt, time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(' ', NB) };
    document.getElementById('rv-n-energy').textContent = c.energy;
    document.getElementById('rv-n-mood').textContent = c.mood;
    applyColor();                                         // the page takes this check-in's color
    reviewBox.scrollTop = 0;
    setLevel('entry');
  }
  function closeReview() {
    reviewEntry = null;
    rvNote.blur();
    applyColor();                                         // back to the check-in page's own color
  }
  // the note: saved as you type; the box grows with it, and the page scrolls once it's taller than the screen
  var noteTimer = 0;
  rvNote.addEventListener('input', function () {
    if (!reviewEntry) return;
    reviewEntry.note = rvNote.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveCheckins, 300);
    sizeNote();
  });
  rvNote.addEventListener('blur', function () { clearTimeout(noteTimer); if (reviewEntry) saveCheckins(); });
  // The scroll position can leave the square a sliver off the physical pixel grid; shift the
  // whole square (color field, lines and dot together) by that sliver so the outer lines cover
  // the field's edges exactly.
  var rvSize = 0;
  function alignReviewGrid() {
    if (!rvSize) return;
    rvField.style.transform = '';
    var g = rvField.getBoundingClientRect();
    rvField.style.transform = 'translate(' + (snap(g.left) - g.left) + 'px, ' + (snap(g.top) - g.top) + 'px)';
    drawGridLines(rvField, rvGrid, rvSize);
  }
  reviewBox.addEventListener('scroll', alignReviewGrid);
  function sizeNote() {
    if (!rvGeo) return;
    rvNote.style.height = 'auto';
    var h = Math.max(rvGeo.lineH, rvNote.scrollHeight);
    rvNote.style.height = h + 'px';
    rvInner.style.height = Math.max(rvGeo.V, rvGeo.noteTop + h + rvGeo.gap) + 'px';
    // keep the line being typed in view
    if (document.activeElement === rvNote) {
      var caretBottom = rvGeo.noteTop + h;
      if (caretBottom > reviewBox.scrollTop + rvGeo.V - 16) reviewBox.scrollTop = caretBottom - rvGeo.V + 16;
    }
  }
  // Laid out like the check-in page: the same square and type, the numbers and their labels above
  // the grid, the note below, spaced evenly from the date at the top to the nav.
  function layoutReview() {
    if (!reviewEntry || !calGeo) return;
    var c = reviewEntry, W = window.innerWidth;
    var size = field.getBoundingClientRect().width || 280;
    var rem = parseFloat(getComputedStyle(root).fontSize) || 16;
    var t = measure(TITLE, 400), fsT = size / (t.left + t.right);
    var digits = measure('0123456789', 400), digitH = digits.asc + digits.desc;
    var fsN = num.fs || 2 * ((size - GW) / CELLS) / digitH, fsL = rem;
    var labInk = measure('MOODENERGY', 600), cap = labInk.asc;
    var labelGap = 1.5 * (labInk.asc + labInk.desc) * fsL;
    var blockH = digitH * fsN + labelGap + cap * fsL;
    var fsE = fsL * 2 / 3, eInk = measure('HIGHLOWENERGYNEGATIVEPOSITIVEMOOD', 400);
    var eH = (eInk.asc + eInk.desc) * fsE, eGap = 1.5 * eH, lab = gridLabels ? eGap + eH : 0;
    var lineH = fsT * 1.25;

    var top = calGeo.contentTop + 8, V = Math.max(1, calGeo.edgeBottom - top);   // under the back button
    reviewBox.style.top = snap(top) + 'px';
    reviewBox.style.height = snap(V) + 'px';
    rvHead.style.top = (calGeo.contentTop + 16 - top) + 'px';   // where the Month title sits
    rvHead.style.left = calGeo.rowX + 'px';
    rvHead.style.width = calGeo.rowW + 'px';
    // one line: "date · time"; if the time would sit alone on a second line, drop the dot
    var NB = '\u00a0', oneLine = parseFloat(getComputedStyle(rvHead).lineHeight) * 1.5;
    rvHead.textContent = rvTitle.date + NB + '· ' + rvTitle.time;
    if (rvHead.offsetHeight > oneLine) {
      rvHead.textContent = rvTitle.date + '\n' + rvTitle.time;
      if (rvHead.offsetHeight > oneLine * 1.6) rvHead.textContent = rvTitle.date + NB + '· ' + rvTitle.time;   // the date itself wraps: keep the dot
    }
    var A = rvHead.offsetTop + rvHead.offsetHeight;      // under the date and time
    var gap = Math.max(16, (V - A - blockH - (size + 2 * lab) - lineH) / 4);
    var blockTop = A + gap, gridTop = blockTop + blockH + gap + lab, noteTop = gridTop + size + lab + gap;
    var left = snap((W - size) / 2), cx = left + size / 2;

    // numbers and their labels, spaced as on the check-in page
    var half = num.cR && num.cL ? (num.cR - num.cL) / 2 : size / 4;
    var base = blockTop + digits.asc * fsN, labBase = base + digits.desc * fsN + labelGap + cap * fsL;
    function put(id, weight, x, y, fs) { var el = document.getElementById(id); var m = measure(el.textContent, weight); place(el, x - (m.right - m.left) * fs / 2, y, fs); }
    put('rv-n-energy', 400, cx - half, base, fsN); put('rv-n-mood', 400, cx + half, base, fsN);
    put('rv-l-energy', 600, cx - half, labBase, fsL); put('rv-l-mood', 600, cx + half, labBase, fsL);

    // the grid: the same square, lines on whole physical pixels, the dot at this check-in's point
    gridTop = snap(gridTop);
    rvField.style.left = left + 'px'; rvField.style.top = gridTop + 'px';
    rvField.style.width = rvField.style.height = size + 'px';
    var pitch = (size - GW) / CELLS;
    rvSize = size;
    ensureField(size * DPR);
    alignReviewGrid();
    var fx = c.mood / CELLS, fy = 1 - c.energy / CELLS;
    rvDot.style.left = (GW / 2 + (size - GW) * fx) + 'px';
    rvDot.style.top = (GW / 2 + (size - GW) * fy) + 'px';
    rvDot.style.width = rvDot.style.height = pitch + 'px';
    rvDot.style.background = 'rgb(' + c.rgb.join(',') + ')';

    // the grid's labels, as on the check-in page
    var cy = gridTop + size / 2;
    put('rv-e-top', 400, cx, gridTop - eGap - eInk.desc * fsE, fsE);
    put('rv-e-bottom', 400, cx, gridTop + size + eGap + eInk.asc * fsE, fsE);
    var el = document.getElementById('rv-e-left'), m = measure(el.textContent, 400);
    var bx = left - eGap - eInk.desc * fsE, by = cy + (m.right - m.left) * fsE / 2;
    place(el, bx, by, fsE); el.setAttribute('transform', 'rotate(-90 ' + bx + ' ' + by + ')');
    el = document.getElementById('rv-e-right'); m = measure(el.textContent, 400);
    bx = left + size + eGap + eInk.desc * fsE; by = cy - (m.right - m.left) * fsE / 2;
    place(el, bx, by, fsE); el.setAttribute('transform', 'rotate(90 ' + bx + ' ' + by + ')');

    // the note: the heading's size and style, as wide as the square
    rvNote.style.left = left + 'px'; rvNote.style.width = size + 'px';
    rvNote.style.top = noteTop + 'px';
    rvNote.style.fontSize = fsT + 'px';
    rvGeo = { V: V, gap: gap, noteTop: noteTop, lineH: lineH };
    sizeNote();
  }

  renderStrip();
  showPage();

  /* ---------- moving the dot (mouse, touch, pen) ---------- */
  var JUMP_MS = 210, SNAP_MS = 180, FOLLOW_MS = 90;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var activeId = null, grabX = 0, grabY = 0;
  var dragging = false, downX = 0, downY = 0;
  var tx = fx, ty = fy;         // where the dot is headed
  var anim = null, frame = 0;   // a glide in progress, if any

  function clamp01(v) { return Math.min(1, Math.max(0, v)); }

  // The glide's easing is 1 + (c+1)u^3 + c*u^2 with u = progress - 1. With c = 0 it is a plain
  // ease-out; a larger c makes it run past the destination and come back. Its furthest point
  // beyond the destination is 4c^3 / 27(c+1)^2 of the trip, so c is solved from the overshoot wanted.
  function overshootConstant(over) {
    var lo = 0, hi = 4;
    for (var i = 0; i < 30; i++) {
      var c = (lo + hi) / 2;
      if (4 * c * c * c / (27 * (c + 1) * (c + 1)) < over) lo = c; else hi = c;
    }
    return (lo + hi) / 2;
  }

  // Glide from the current position to (tx, ty). The target may keep moving while the glide
  // runs; every frame repaints, so the colors along the way show.
  function glide(ms, overshoot) {
    cancelAnimationFrame(frame);
    if (reduceMotion.matches || (fx === tx && fy === ty)) {
      fx = tx; fy = ty; anim = null; paint();
      return;
    }
    var c = 0;
    if (overshoot) {
      // go 12% past the destination, but never more than about a third of a cell,
      // so the numbers never flick to a neighboring value on the way
      var trip = Math.sqrt((tx - fx) * (tx - fx) + (ty - fy) * (ty - fy));
      c = overshootConstant(Math.min(0.12, 0.035 / trip));
    }
    anim = { x0: fx, y0: fy, start: null, dur: ms, p: 0, c: c };
    frame = requestAnimationFrame(step);
  }
  function step(now) {
    if (!anim) return;
    if (anim.start === null) anim.start = now;
    anim.p = Math.min(1, (now - anim.start) / anim.dur);
    var u = anim.p - 1;
    var e = 1 + (anim.c + 1) * u * u * u + anim.c * u * u;
    fx = clamp01(anim.x0 + (tx - anim.x0) * e);     // never past the square's edges
    fy = clamp01(anim.y0 + (ty - anim.y0) * e);
    if (anim.p >= 1) { fx = tx; fy = ty; anim = null; }
    paint();
    if (anim) frame = requestAnimationFrame(step);
  }

  // The pointer's position as a place on the square; anything outside lands on the nearest edge.
  function pointerTarget(e) {
    var r = field.getBoundingClientRect();
    tx = clamp01((e.clientX - grabX - r.left - GW / 2) / (r.width  - GW));
    ty = clamp01((e.clientY - grabY - r.top  - GW / 2) / (r.height - GW));
  }
  function snapTarget() {
    tx = Math.round(tx * CELLS) / CELLS;
    ty = Math.round(ty * CELLS) / CELLS;
  }

  // A press anywhere on the page that is not a control moves the dot.
  document.addEventListener('pointerdown', function (e) {
    if (activeId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (page !== 'check-in') return;
    if (e.target && e.target.closest && e.target.closest('button, #nav')) return;
    activeId = e.pointerId;
    try { field.setPointerCapture(e.pointerId); } catch (err) {}
    dot.classList.add('dragging');

    if (e.target === dot) {
      // grabbed the dot itself: stop any glide and keep the grab offset so it doesn't jump
      cancelAnimationFrame(frame); anim = null;
      var r = field.getBoundingClientRect();
      grabX = e.clientX - (r.left + GW / 2 + fx * (r.width  - GW));
      grabY = e.clientY - (r.top  + GW / 2 + fy * (r.height - GW));
      tx = fx; ty = fy;
      dragging = true;
    } else {
      // a click on the square or the background: jump to the nearest grid point,
      // which for a background click is on the edge of the square facing the click
      grabX = grabY = 0;
      dragging = false; downX = e.clientX; downY = e.clientY;
      pointerTarget(e);
      snapTarget();
      glide(JUMP_MS, true);
    }
    e.preventDefault();
  });

  field.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activeId) return;
    if (!dragging) {
      // the press only becomes a drag once the pointer has really moved
      var dx = e.clientX - downX, dy = e.clientY - downY;
      if (dx * dx + dy * dy < 16) return;
      dragging = true;
      pointerTarget(e);
      glide(FOLLOW_MS, false);                      // catch up with the pointer, then follow it
    } else {
      pointerTarget(e);
      if (!anim) { fx = tx; fy = ty; paint(); }     // mid-glide, the glide follows the new target
    }
    e.preventDefault();
  });

  // After a drag the dot settles on the nearest line intersection. After a plain click
  // there is nothing to do: the jump it started already ends on one.
  function release(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    dot.classList.remove('dragging');
    if (!dragging) return;
    dragging = false;
    snapTarget();
    glide(SNAP_MS, false);
  }
  field.addEventListener('pointerup', release);
  field.addEventListener('pointercancel', release);
  field.addEventListener('lostpointercapture', release);
  dot.addEventListener('dragstart', function (e) { e.preventDefault(); });
  field.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- start ---------- */
  layout();
  paint();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  (function watchDensity() {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    var again = function () { layout(); watchDensity(); };
    if (mq.addEventListener) mq.addEventListener('change', again, { once: true });
    else if (mq.addListener) mq.addListener(function h() { mq.removeListener(h); again(); });
  })();

  // re-fit the text once the font in use has arrived
  function fontsArrived() {
    if (!(document.fonts && document.fonts.load)) return;
    var family = 'Geist';
    var sample = TITLE + '0123456789MOODENERGYNight mode';
    ['400', '600'].forEach(function (w) {
      document.fonts.load(w + ' 16px "' + family + '"', sample).then(layout, function () {});
    });
    if (document.fonts.ready) document.fonts.ready.then(layout);
  }
  fontsArrived();

  // an earlier version let a click on the site name switch fonts and remembered the choice; forget it
  try { localStorage.removeItem('page-font'); } catch (err) {}

  ensureField(Math.max(512, field.getBoundingClientRect().width * DPR));
  paint();
})();
</script>
</body>
</html>
