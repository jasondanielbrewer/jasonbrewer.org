<!DOCTYPE html>
<html lang="en" class="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>jasonbrewer.org</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&display=swap">
<style>
  :root {
    --dot: #f0f0f0;           /* the color under the dot, replaced live */
    --page: #000;             /* page background: black in night mode, the dot's color otherwise */
    --ink: #f0f0f0;           /* text: the dot's color in night mode, black or white otherwise */
    --line: #000;             /* dot outline: black or white by day, black in night mode */
    --tick-room: 0px;         /* how far ENERGY / MOOD move down when the axis numbers show */
    --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;   /* the page font, switched by clicking the site name */
    --lab-fs: 14px;           /* font size of ENERGY / MOOD, set by the script */
    --cap: 0.72;              /* capital-letter height as a fraction of the font size, measured by the script */
    --size: min(33.333vh, calc(100vw - 48px));   /* refined by the script */
    --cell: calc(var(--size) / 10);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no browser may enlarge text on its own */
  html, body {
    touch-action: pinch-zoom;   /* a finger pressed on the background can steer the dot */
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--page);
    overscroll-behavior: none;
  }

  #field {
    position: fixed;
    left: calc(50% - var(--size) / 2);
    top: calc(50% - var(--size) / 2);
    width: var(--size);
    height: var(--size);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    cursor: pointer;
  }

  #field img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* 11 x 11 black lines, 1px each */
  #grid { position: absolute; inset: 0; pointer-events: none; }
  #grid i { position: absolute; background: #000; }
  #grid i.v { top: 0; bottom: 0; width: 1px; }
  #grid i.h { left: 0; right: 0; height: 1px; }

  #dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--cell);
    height: var(--cell);
    box-sizing: border-box;
    border: 2px solid var(--line);
    transition: border-color .15s;
    border-radius: 50%;
    background: var(--dot);
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
  }
  #dot.dragging { cursor: grabbing; }

  /* heading, numbers and labels: placed in pixels by the script */
  #text {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  #text text {
    font-family: var(--font);
    fill: var(--ink);
    transition: fill .15s;
    text-rendering: geometricPrecision;   /* exact glyph positions at any size */
  }
  #text text { font-weight: 400; text-anchor: start; }
  #text .lab { font-weight: 700; }
  :root.night #text text { transition: none; }   /* text keeps exact pace with the dot's color */

  /* The three switches. Their words are the size of ENERGY / MOOD in regular weight.
     Each toggle is sized in the words' own units (em), to exactly the height of their
     capital letters, and stands on the same baseline as the words. */
  .switch {
    --sw: calc(var(--cap) * 1em);
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    display: block;
    margin: 0; padding: 10px 8px;
    border: 0; background: none; color: var(--ink);
    font: 400 var(--lab-fs)/1 var(--font);
    text-rendering: geometricPrecision;
    white-space: nowrap;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #night { top: calc(env(safe-area-inset-top, 0px) + 6px); }
  #hide  { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
  #key   { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); right: auto; left: calc(env(safe-area-inset-left, 0px) + 8px); }
  .switch:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; border-radius: 6px; }
  .switch .track {
    display: inline-block; vertical-align: baseline;   /* an empty inline block sits exactly on the text baseline */
    position: relative;
    height: var(--sw); width: calc(var(--sw) * 1.75); box-sizing: border-box;
    border: calc(var(--sw) * 0.12) solid currentColor; border-radius: 999px;
  }
  .switch .thumb {
    position: absolute; top: 50%; left: calc(var(--sw) * 0.13);
    width: calc(var(--sw) * 0.5); height: calc(var(--sw) * 0.5); border-radius: 50%;
    background: currentColor;
    transform: translateY(-50%);
    transition: transform .15s;
  }
  .switch .words + .track, .switch .track + .words { margin-left: calc(var(--sw) * 0.8); }
  .switch[aria-checked="true"] .track { background: currentColor; }
  .switch[aria-checked="true"] .thumb { background: var(--page); transform: translate(calc(var(--sw) * 0.75), -50%); }
  @media (prefers-reduced-motion: reduce) { .switch .thumb { transition: none; } }

  /* HIDE CONTROLS on: only the square, the dot and this one toggle remain */
  :root.bare #text, :root.bare #night, :root.bare #key, :root.bare #site, :root.bare #hide .words { visibility: hidden; }

  /* the key: axis numbers 0-10 beside and below the square, each with a small tick mark */
  #ticks { display: none; }
  #ticks rect { fill: var(--ink); }
  /* the square's bottom-left corner pixel, drawn over the black grid in the ticks' color so the
     two zero ticks meet in an unbroken right angle */
  #corner { display: none; position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; background: var(--ink); }
  :root.ticks:not(.bare) #corner { display: block; }
  :root.ticks #ticks { display: inline; }

  /* the big numbers and their labels step down to make room, and back up again */
  #block { transition: transform .6s cubic-bezier(.3, 1.9, .5, 1); }
  @supports (transition-timing-function: linear(0, 1)) {
    #block { transition-timing-function: linear(0, 0.35 12%, 0.75 24%, 1.02 34%, 1.13 44%, 1.14 50%, 1.09 60%, 1.02 70%, 0.985 80%, 0.99 90%, 1); }
  }
  :root.ticks #block { transform: translateY(var(--tick-room)); }
  @media (prefers-reduced-motion: reduce) { #block { transition: none; } }

  /* invisible button laid over the site name so it can be clicked, tapped or reached by keyboard */
  #site {
    position: fixed; margin: 0; padding: 0; border: 0; background: none;
    color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #site:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; border-radius: 6px; }
</style>
</head>
<body>
<svg id="text" xmlns="http://www.w3.org/2000/svg">
  <text id="t-site">jasonbrewer.org</text>
  <g id="ticks"></g>
  <text id="t-title">How are you feeling?</text>
  <g id="block">
    <text id="n-energy" class="num">5</text>
    <text id="n-mood" class="num">5</text>
    <text id="l-energy" class="lab">ENERGY</text>
    <text id="l-mood" class="lab">MOOD</text>
  </g>
</svg>
<div id="safe" aria-hidden="true" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)"></div>
<button id="site" type="button" aria-pressed="false" aria-label="jasonbrewer.org: switch the font"></button>
<button id="night" class="switch" type="button" role="switch" aria-checked="true"><span class="words">NIGHT MODE</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button>
<button id="key" class="switch" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span class="words">SHOW KEY</span></button>
<button id="hide" class="switch" type="button" role="switch" aria-checked="false" aria-label="Hide controls"><span class="words">HIDE CONTROLS</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button>

<script>
(function () {
  var root  = document.documentElement;
  var field = document.getElementById('field');
  var grid  = document.getElementById('grid');
  var dot   = document.getElementById('dot');
  var safe  = document.getElementById('safe');
  var img   = document.getElementById('src');
  var theme = document.querySelector('meta[name="theme-color"]');

  var CELLS = 10;
  var fx = 0.5, fy = 0.5;      // dot position as a fraction of the field
  var pixels = null, pw = 0, ph = 0;

  /* ---------- grid lines ---------- */
  var lines = [];
  for (var n = 0; n <= CELLS; n++) {
    var v = document.createElement('i'); v.className = 'v';
    var h = document.createElement('i'); h.className = 'h';
    grid.appendChild(v); grid.appendChild(h);
    lines.push([v, h]);
  }

  /* ---------- text ---------- */
  var FONTS = {
    geist:    '"Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
    alegreya: '"Alegreya", Georgia, "Times New Roman", serif'
  };
  var fontName = 'geist';
  var FAMILY = FONTS[fontName];   // the stack used for both drawing and measuring
  var TITLE = 'How are you feeling?';
  var tTitle  = document.getElementById('t-title');
  var tSite   = document.getElementById('t-site');
  var siteBtn = document.getElementById('site');

  // axis numbers: 0-10 up the left side (0 at the bottom) and 0-10 along the bottom (0 at the left)
  var ticksG = document.getElementById('ticks'), ticksV = [], ticksH = [], marksV = [], marksH = [];
  var axisV = document.createElementNS('http://www.w3.org/2000/svg', 'text');   // ENERGY, reading bottom to top
  var axisH = document.createElementNS('http://www.w3.org/2000/svg', 'text');   // MOOD
  axisV.textContent = 'ENERGY'; axisH.textContent = 'MOOD';
  ticksG.appendChild(axisV); ticksG.appendChild(axisH);
  for (var v = 0; v <= 10; v++) {
    [ticksV, ticksH].forEach(function (set) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.textContent = String(v);
      ticksG.appendChild(el);
      set.push(el);
    });
    [marksV, marksH].forEach(function (set) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      ticksG.appendChild(el);
      set.push(el);
    });
  }
  var nMood   = document.getElementById('n-mood');
  var nEnergy = document.getElementById('n-energy');
  var lMood   = document.getElementById('l-mood');
  var lEnergy = document.getElementById('l-energy');
  var mctx = document.createElement('canvas').getContext('2d');

  // Ink metrics of a string, as fractions of the font size.
  function measure(text, weight) {
    mctx.font = weight + ' 100px ' + FAMILY;
    var m = mctx.measureText(text);
    return {
      left:  m.actualBoundingBoxLeft / 100,     // ink left of the origin
      right: m.actualBoundingBoxRight / 100,    // ink right of the origin
      asc:   m.actualBoundingBoxAscent / 100,   // ink above the baseline
      desc:  m.actualBoundingBoxDescent / 100,  // ink below the baseline
      adv:   m.width / 100
    };
  }
  function place(el, x, y, fontSize) {
    el.setAttribute('x', x);
    el.setAttribute('y', y);
    el.style.fontSize = fontSize + 'px';
  }

  // geometry shared by layoutText() and placeNumbers()
  var num = { cL: 0, cR: 0, base: 0, fs: 0, labBase: 0, labFs: 0 };

  // place a string so its ink is centered on x = c
  function centered(el, weight, c, y, fs) {
    var m = measure(el.textContent, weight);
    place(el, c - (m.right - m.left) * fs / 2, y, fs);
  }

  // Each number is centered on a fixed point, with its label centered beneath,
  // so nothing shifts when a number goes between one and two digits.
  function placeNumbers() {
    centered(nEnergy, 400, num.cL, num.base, num.fs);         // energy on the left
    centered(nMood,   400, num.cR, num.base, num.fs);         // mood on the right
    centered(lEnergy, 700, num.cL, num.labBase, num.labFs);
    centered(lMood,   700, num.cR, num.labBase, num.labFs);
  }

  // mobile: 0 = desktop arrangement, 1 = mobile arrangement, in between while the window changes shape.
  // edgeTop / edgeBottom: the usable top and bottom of the screen.
  function layoutText(left, top, size, mobile, edgeTop, edgeBottom, edgeLeft) {
    // Reference unit: the heading's font size if it spanned the full square.
    var t = measure(TITLE, 400);
    var fs1 = size / (t.left + t.right);
    var textH = (t.asc + t.desc) * fs1;
    var digits = measure('0123456789', 400);
    var digitH = digits.asc + digits.desc;

    var h = t;                    // the heading is regular weight
    var fsT = size / (h.left + h.right);                         // heading: as wide as the square
    var fsSite = fs1 * (7 / 8) * 0.75;                           // site name: its size is unchanged
    var fsN = fs1 * 3;            // numbers
    var fsL = fs1 * 0.45 * 1.25;  // labels

    function mix(a, b) { return a + (b - a) * mobile; }
    var bottom = top + size;
    var base = 2 * textH + digitH * fs1;

    // Heading, centered over the square.
    //   desktop: its centerline keeps the height above the square set earlier
    //   mobile:  its centerline is halfway between the bottom of the site name and the top of the square
    var siteM = measure(tSite.textContent, 400);
    var siteBottom = edgeTop + PAD + (siteM.asc + siteM.desc) * fsSite;       // bottom of the site name's letters
    var headMobile = (siteBottom + top) / 2;
    var centerY = mix(top - (1.5 * base - 0.2 * textH - 0.96 * fs1), headMobile);
    var titleW = (h.left + h.right) * fsT;
    place(tTitle, left + (size - titleW) / 2 + h.left * fsT,
          centerY + (h.asc - h.desc) * fsT / 2, fsT);

    // Site name, upper left: same weight as the heading at 3/4 of its size.
    // Its ink sits 16px from the top and left edges, like the toggles on the right.
    var site = measure(tSite.textContent, 400);
    var fsS = fsSite;
    place(tSite, edgeLeft + 16 + site.left * fsS, edgeTop + 16 + site.asc * fsS, fsS);
    siteBtn.style.left   = (edgeLeft + 16 - 8) + 'px';              // its click area, a little larger than the letters
    siteBtn.style.top    = (edgeTop + 16 - 8) + 'px';
    siteBtn.style.width  = ((site.left + site.right) * fsS + 16) + 'px';
    siteBtn.style.height = ((site.asc + site.desc) * fsS + 16) + 'px';

    // Axis numbers: regular weight, 2/3 the size of ENERGY / MOOD, set 2/3 as far
    // from the square as before.
    var pitch = (size - 1) / CELLS;
    var fsK = fsL * 2 / 3;
    var zero = measure('0', 400);
    var clear = (pitch / 2 + fsL * 0.35) * 2 / 3;
    var widest = measure('10', 400);
    var clearLeft = Math.min(clear, Math.max(2, left - edgeLeft - 4 - (widest.left + widest.right) * fsK));  // never off-screen
    // tick marks carry each numbered gridline 1/4 of a cell out from the square
    var tick = pitch / 4;
    var tickLeft = Math.max(0, Math.min(tick, clearLeft - fsL * 0.2));   // shorter only if the numbers had to move in
    function box(el, x, y, w, h) {
      el.setAttribute('x', x); el.setAttribute('y', y);
      el.setAttribute('width', w); el.setAttribute('height', h);
    }
    for (var n = 0; n <= CELLS; n++) {
      box(marksV[n], left - tickLeft, top + Math.round((CELLS - n) * pitch), tickLeft, 1);
      box(marksH[n], left + Math.round(n * pitch), bottom, 1, tick);
      var m = measure(String(n), 400);
      // up the left side: right-aligned beside its horizontal line, centered on it
      var lineY = top + Math.round((CELLS - n) * pitch) + 0.5;
      place(ticksV[n], left - clearLeft - m.right * fsK, lineY + (zero.asc - zero.desc) * fsK / 2, fsK);
      // along the bottom: centered under its vertical line
      var lineX = left + Math.round(n * pitch) + 0.5;
      place(ticksH[n], lineX - (m.right - m.left) * fsK / 2, bottom + clear + digits.asc * fsK, fsK);
    }
    // Axis titles, same size and weight as the axis numbers.
    var capK = measure('H', 400).asc * fsK;        // height of their capitals
    var gapK = fsK * 0.7;                          // space between the numbers and their title
    var cx0 = left + size / 2, cy0 = top + size / 2;

    // ENERGY: left of the side numbers, turned to read bottom to top, centered on the square's height
    var en = measure('ENERGY', 400);
    var numbersLeft = left - clearLeft - (widest.left + widest.right) * fsK;      // left edge of the widest number
    var baseX = Math.max(edgeLeft + 2 + capK, numbersLeft - gapK);                // never off-screen
    var startY = cy0 + (en.right - en.left) * fsK / 2;
    place(axisV, baseX, startY, fsK);
    axisV.setAttribute('transform', 'rotate(-90 ' + baseX + ' ' + startY + ')');

    // MOOD: below the bottom numbers, centered on the square's width
    var mo = measure('MOOD', 400);
    var rowBottom = clear + digitH * fsK;                                          // bottom of the numbers, from the square
    place(axisH, cx0 - (mo.right - mo.left) * fsK / 2, bottom + rowBottom + gapK + capK, fsK);

    // room the key takes up below the square: down to the bottom of the word MOOD
    root.style.setProperty('--tick-room', (rowBottom + gapK + capK) * (1 - mobile / 2) + 'px');

    // Numbers with their labels, treated as one block.
    //   desktop: the block starts the set distance below the square
    //   mobile:  the block is centered between the bottom of the square and the top of SHOW KEY
    var cap = measure('MOODENERGY', 700).asc;
    var labelGap = 2.25 * cap * (fs1 * 0.45);                 // number bottom to label top
    var blockH = digitH * fsN + labelGap + cap * fsL;
    var keyTop = edgeBottom - PAD - measure('H', 400).asc * fsL;               // top of the words SHOW KEY
    var blockMobile = (bottom + keyTop) / 2 - blockH / 2;
    var blockTop = mix(bottom + 1.5 * (base - digitH * fsN / 2), blockMobile);

    // The two centers are set so that when both read 10, the clear space between
    // them is half the width of one "10" on desktop, and 80% of that on mobile.
    var ten = measure('10', 400);
    var tenW = (ten.left + ten.right) * fsN;
    var half = (tenW + tenW * mix(0.5, 0.4)) / 2;
    var cx = left + size / 2;
    num.fs = fsN; num.cL = cx - half; num.cR = cx + half;
    num.base = blockTop + digits.asc * fsN;
    num.labFs = fsL;
    root.style.setProperty('--lab-fs', fsL + 'px');          // the switches use the same size...
    root.style.setProperty('--cap', measure('H', 400).asc);  // ...and are as tall as their own capitals
    num.labBase = num.base + digits.desc * fsN + labelGap + cap * fsL;
    placeNumbers();
  }

  // Keep both toggles the same distance from their screen edge as from the right edge:
  // the top one measured from its top, the bottom one from its bottom.
  function placeSwitches(edgeTop, edgeBottom, H, edgeLeft) {
    var EDGE = 16;
    var nb = document.getElementById('night'), hb = document.getElementById('hide');
    nb.style.top = ''; hb.style.bottom = '';
    var nt = nb.querySelector('.track').getBoundingClientRect();
    nb.style.top = (nb.getBoundingClientRect().top + (edgeTop + EDGE) - nt.top) + 'px';
    var ht = hb.querySelector('.track').getBoundingClientRect();
    hb.style.bottom = (H - hb.getBoundingClientRect().bottom - ((edgeBottom - EDGE) - ht.bottom)) + 'px';

    // SHOW KEY, lower left: same line as HIDE CONTROLS, its toggle 16px from the left edge
    var kb = document.getElementById('key');
    kb.style.bottom = hb.style.bottom;
    kb.style.left = '';
    var kt = kb.querySelector('.track').getBoundingClientRect();
    kb.style.left = (kb.getBoundingClientRect().left + (edgeLeft + EDGE) - kt.left) + 'px';
  }

  /* ---------- sizing ---------- */
  var PAD = 16;            // distance of the corner controls (and the key) from the screen edges
  var GAP_TOP = 12;        // least space between the top row and the heading
  var GAP_BOTTOM = 14;     // least space between the big numbers and the bottom row
  var NEAR = 0.09;         // heading stays this fraction of the square away from it
  var BLOCK_GAP = 0.10;    // big numbers stay this fraction of the square below it (or below the key)

  // The largest square the mobile arrangement can hold. Every text size is a fixed
  // fraction of the square, so the space needed around it is (k * size + px).
  // These fractions mirror layoutText().
  function mobileFit(W, edgeTop, edgeBottom, edgeLeft) {
    var t = measure(TITLE, 400), u = 1 / (t.left + t.right);
    var digits = measure('0123456789', 400), digitH = digits.asc + digits.desc;
    var capH = measure('H', 400).asc, capB = measure('MOODENERGY', 700).asc;
    var ten = measure('10', 400), site = measure(tSite.textContent, 400);
    var fsL = 0.5625 * u, fsK = fsL * 2 / 3;
    var clear = (0.05 + fsL * 0.35) * 2 / 3;
    var keySide = clear + (ten.left + ten.right) * fsK + 0.7 * fsK + capH * fsK;   // key, left of the square
    var keyDown = clear + digitH * fsK + 0.7 * fsK + capH * fsK;                   // key, below the square
    var blockH  = digitH * 3 * u + 2.25 * capB * 0.45 * u + capB * fsL;            // big numbers and labels
    var above = { k: NEAR + (t.asc + t.desc) * u + (site.asc + site.desc) * 0.65625 * u, px: PAD + GAP_TOP };
    var below = { k: BLOCK_GAP + keyDown + blockH + capH * fsL, px: PAD + GAP_BOTTOM };
    return {
      // wide enough that the key, when shown, ends PAD from the screen's left edge
      byWidth:  (W - 2 * (edgeLeft + PAD)) / (1 + 2 * keySide),
      // tall enough for the heading above and the key plus the big numbers below
      byHeight: (edgeBottom - edgeTop - above.px - below.px) / (1 + above.k + below.k),
      below: below
    };
  }

  // Desktop: the square is 1/3 of the screen's height.
  // Mobile (portrait): the square grows to fill the width, leaving only the room the key
  // needs at the sides, for as long as the text above and below still fits.
  // The two blend gradually as the window changes shape; there is no breakpoint.
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    var cs = getComputedStyle(safe);
    var edgeTop = parseFloat(cs.paddingTop) || 0;
    var edgeBottom = H - (parseFloat(cs.paddingBottom) || 0);
    var edgeLeft = parseFloat(cs.paddingLeft) || 0;

    // 0 while the window is wider than tall, 1 once it is 4:3 portrait or taller
    var k = Math.min(1, Math.max(0, (1 - W / H) / 0.25));
    var mobile = k * k * (3 - 2 * k);

    var margin = Math.max(24, W * 0.06);
    var desk = Math.min(H / 3, W - 2 * margin);
    var fit = mobileFit(W, edgeTop, edgeBottom, edgeLeft);
    var mob = Math.min(fit.byWidth, fit.byHeight, Math.max(H / 3, 400));   // tablets stay near 1/3 height
    var size = Math.max(21, Math.round(desk + (mob - desk) * mobile));
    var pitch = (size - 1) / CELLS;                 // one cell

    root.style.setProperty('--size', size + 'px');
    root.style.setProperty('--cell', pitch + 'px');
    var left = Math.round((W - size) / 2);
    // centered, moving up only as far as the text below the square needs
    var top = (H - size) / 2;
    top -= mobile * Math.max(0, top + size + fit.below.k * size + fit.below.px - edgeBottom);
    top = Math.round(top);
    field.style.left = left + 'px';
    field.style.top  = top + 'px';

    layoutText(left, top, size, mobile, edgeTop, edgeBottom, edgeLeft);
    placeSwitches(edgeTop, edgeBottom, H, edgeLeft);

    // grid lines stay on whole pixels so they remain sharp at every size
    for (var n = 0; n <= CELLS; n++) {
      var at = Math.round(n * pitch);
      lines[n][0].style.left = at + 'px';
      lines[n][1].style.top  = at + 'px';
    }
  }

  /* ---------- color sampling (from the image, never the grid) ---------- */
  function loadPixels() {
    var c = document.createElement('canvas');
    pw = c.width  = img.naturalWidth;
    ph = c.height = img.naturalHeight;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    pixels = ctx.getImageData(0, 0, pw, ph).data;
    paint();
  }

  function paint() {
    dot.style.left = 'calc(0.5px + (100% - 1px) * ' + fx + ')';
    dot.style.top  = 'calc(0.5px + (100% - 1px) * ' + fy + ')';

    // nearest grid point, 0-10: energy runs bottom to top, mood left to right
    var energy = String(Math.round((1 - fy) * CELLS));
    var mood = String(Math.round(fx * CELLS));
    if (nMood.textContent !== mood || nEnergy.textContent !== energy) {
      nMood.textContent = mood;
      nEnergy.textContent = energy;
      placeNumbers();
    }

    if (!pixels) return;
    var x = Math.min(pw - 1, Math.max(0, Math.floor(fx * pw)));
    var y = Math.min(ph - 1, Math.max(0, Math.floor(fy * ph)));
    var k = (y * pw + x) * 4;
    rgb = [pixels[k], pixels[k + 1], pixels[k + 2]];
    applyColor();
  }

  /* ---------- colors: day and night ---------- */
  var night = false, rgb = null;
  var nightBtn = document.getElementById('night');

  function applyColor() {
    var color = rgb ? 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')' : '#f0f0f0';
    var page, ink;
    if (night) {
      // black page; the text takes the color under the dot
      page = '#000';
      ink = color;
    } else {
      // the page takes the color under the dot; text is black, or white where black would be hard to read
      page = color;
      ink = '#000';
      if (rgb) {
        var lum = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
        if (lum <= 0.179) ink = '#fff';
      }
    }
    root.style.setProperty('--dot', color);
    root.style.setProperty('--page', page);
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--line', night ? '#000' : ink);
    if (theme) theme.setAttribute('content', page);
  }
  function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

  function setNight(on) {
    night = on;
    root.classList.toggle('night', on);
    nightBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    applyColor();
  }
  nightBtn.addEventListener('click', function () {
    setNight(!night);
    try { localStorage.setItem('night-mode', night ? '1' : '0'); } catch (err) {}   // remembered on this device
  });
  // night mode is on by default; a device that has switched it off keeps it off
  var savedNight = null;
  try { savedNight = localStorage.getItem('night-mode'); } catch (err) {}
  setNight(savedNight !== '0');

  /* ---------- SHOW KEY: axis numbers and tick marks ---------- */
  var keyBtn = document.getElementById('key');
  keyBtn.addEventListener('click', function () {
    var on = !root.classList.contains('ticks');
    root.classList.toggle('ticks', on);
    keyBtn.setAttribute('aria-checked', on ? 'true' : 'false');
  });

  /* ---------- hide controls ---------- */
  var hideBtn = document.getElementById('hide');
  hideBtn.addEventListener('click', function () {
    var on = hideBtn.getAttribute('aria-checked') !== 'true';
    hideBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    root.classList.toggle('bare', on);
  });

  /* ---------- moving the dot (mouse, touch, pen) ---------- */
  var JUMP_MS = 210, SNAP_MS = 180, FOLLOW_MS = 90;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var activeId = null, grabX = 0, grabY = 0;
  var dragging = false, downX = 0, downY = 0;
  var tx = fx, ty = fy;         // where the dot is headed
  var anim = null, frame = 0;   // a glide in progress, if any

  function clamp01(v) { return Math.min(1, Math.max(0, v)); }

  // The glide's easing is 1 + (c+1)u^3 + c*u^2 with u = progress - 1. With c = 0 it is a plain
  // ease-out; a larger c makes it run past the destination and come back. Its furthest point
  // beyond the destination is 4c^3 / 27(c+1)^2 of the trip, so c is solved from the overshoot wanted.
  function overshootConstant(over) {
    var lo = 0, hi = 4;
    for (var i = 0; i < 30; i++) {
      var c = (lo + hi) / 2;
      if (4 * c * c * c / (27 * (c + 1) * (c + 1)) < over) lo = c; else hi = c;
    }
    return (lo + hi) / 2;
  }

  // Glide from the current position to (tx, ty). The target may keep moving while the glide
  // runs; every frame repaints, so the colors along the way show.
  function glide(ms, overshoot) {
    cancelAnimationFrame(frame);
    if (reduceMotion.matches || (fx === tx && fy === ty)) {
      fx = tx; fy = ty; anim = null; paint();
      return;
    }
    var c = 0;
    if (overshoot) {
      // go 12% past the destination, but never more than about a third of a cell,
      // so the numbers never flick to a neighboring value on the way
      var trip = Math.sqrt((tx - fx) * (tx - fx) + (ty - fy) * (ty - fy));
      c = overshootConstant(Math.min(0.12, 0.035 / trip));
    }
    anim = { x0: fx, y0: fy, start: null, dur: ms, p: 0, c: c };
    frame = requestAnimationFrame(step);
  }
  function step(now) {
    if (!anim) return;
    if (anim.start === null) anim.start = now;
    anim.p = Math.min(1, (now - anim.start) / anim.dur);
    var u = anim.p - 1;
    var e = 1 + (anim.c + 1) * u * u * u + anim.c * u * u;
    fx = clamp01(anim.x0 + (tx - anim.x0) * e);     // never past the square's edges
    fy = clamp01(anim.y0 + (ty - anim.y0) * e);
    if (anim.p >= 1) { fx = tx; fy = ty; anim = null; }
    paint();
    if (anim) frame = requestAnimationFrame(step);
  }

  // The pointer's position as a place on the square; anything outside lands on the nearest edge.
  function pointerTarget(e) {
    var r = field.getBoundingClientRect();
    tx = clamp01((e.clientX - grabX - r.left - 0.5) / (r.width  - 1));
    ty = clamp01((e.clientY - grabY - r.top  - 0.5) / (r.height - 1));
  }
  function snapTarget() {
    tx = Math.round(tx * CELLS) / CELLS;
    ty = Math.round(ty * CELLS) / CELLS;
  }

  // A press anywhere on the page that is not a control moves the dot.
  document.addEventListener('pointerdown', function (e) {
    if (activeId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    activeId = e.pointerId;
    try { field.setPointerCapture(e.pointerId); } catch (err) {}
    dot.classList.add('dragging');

    if (e.target === dot) {
      // grabbed the dot itself: stop any glide and keep the grab offset so it doesn't jump
      cancelAnimationFrame(frame); anim = null;
      var r = field.getBoundingClientRect();
      grabX = e.clientX - (r.left + 0.5 + fx * (r.width  - 1));
      grabY = e.clientY - (r.top  + 0.5 + fy * (r.height - 1));
      tx = fx; ty = fy;
      dragging = true;
    } else {
      // a click on the square or the background: jump to the nearest grid point,
      // which for a background click is on the edge of the square facing the click
      grabX = grabY = 0;
      dragging = false; downX = e.clientX; downY = e.clientY;
      pointerTarget(e);
      snapTarget();
      glide(JUMP_MS, true);
    }
    e.preventDefault();
  });

  field.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activeId) return;
    if (!dragging) {
      // the press only becomes a drag once the pointer has really moved
      var dx = e.clientX - downX, dy = e.clientY - downY;
      if (dx * dx + dy * dy < 16) return;
      dragging = true;
      pointerTarget(e);
      glide(FOLLOW_MS, false);                      // catch up with the pointer, then follow it
    } else {
      pointerTarget(e);
      if (!anim) { fx = tx; fy = ty; paint(); }     // mid-glide, the glide follows the new target
    }
    e.preventDefault();
  });

  // After a drag the dot settles on the nearest line intersection. After a plain click
  // there is nothing to do: the jump it started already ends on one.
  function release(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    dot.classList.remove('dragging');
    if (!dragging) return;
    dragging = false;
    snapTarget();
    glide(SNAP_MS, false);
  }
  field.addEventListener('pointerup', release);
  field.addEventListener('pointercancel', release);
  field.addEventListener('lostpointercapture', release);
  dot.addEventListener('dragstart', function (e) { e.preventDefault(); });
  field.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- start ---------- */
  layout();
  paint();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);

  // re-fit the text once the font in use has arrived
  function fontsArrived() {
    if (!(document.fonts && document.fonts.load)) return;
    var family = fontName === 'alegreya' ? 'Alegreya' : 'Geist';
    var sample = TITLE + '0123456789MOODENERGYNIGHTHIDECONTROLSSHOWKEY' + tSite.textContent;
    ['400', '700'].forEach(function (w) {
      document.fonts.load(w + ' 16px "' + family + '"', sample).then(layout, function () {});
    });
    if (document.fonts.ready) document.fonts.ready.then(layout);
  }
  fontsArrived();

  /* ---------- site name: Geist <-> Alegreya for the whole page ---------- */
  function setFont(name) {
    fontName = name;
    FAMILY = FONTS[name];
    root.style.setProperty('--font', FAMILY);
    siteBtn.setAttribute('aria-pressed', name === 'alegreya' ? 'true' : 'false');
    layout();          // everything is measured again in the new font
    fontsArrived();    // ...and once more when its files have loaded
  }
  siteBtn.addEventListener('click', function () {
    setFont(fontName === 'geist' ? 'alegreya' : 'geist');
    try { localStorage.setItem('page-font', fontName); } catch (err) {}   // remembered on this device
  });
  try { if (localStorage.getItem('page-font') === 'alegreya') setFont('alegreya'); } catch (err) {}

  if (img.complete && img.naturalWidth) loadPixels();
  else img.addEventListener('load', loadPixels);
})();
</script>
</body>
</html>
