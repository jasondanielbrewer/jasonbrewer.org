<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Air Hockey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<style>
  /* Layout: one column — opponent score, rink canvas filling the rest, your score. */
  :root {
    --ink: #000;
    --line: #fff;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--line);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-sizing: border-box;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .score {
    font-size: 30px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform .25s ease-out;
  }
  .score.bump { transform: scale(1.45); transition: none; }
  #rink {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; touch-action: none; max-width: 100%; }
  @media (prefers-reduced-motion: reduce) { .score { transition: none; } .score.bump { transform: none; } }
</style>

<div class="score" id="cpu" aria-label="Opponent score">0</div>
<div id="rink"><canvas id="c" aria-label="Air hockey rink"></canvas></div>
<div class="score" id="you" aria-label="Your score">0</div>

<script>
(() => {
  // ---- Rink geometry, in field units (2 wide × 3 tall, y grows downward) ----
  const W = 2;
  let H = 3;                    // stretches taller on phones to fill the screen
  const GOAL = 0.34;            // half-width of each goal opening
  const SR = 0.14;              // striker radius
  const BR = 0.065;             // ball radius
  let BASE = H - 0.28;          // your striker's baseline
  const OPP_Y = 0.28;           // opponent's baseline
  let LURCH = H / 4;            // shot reach: 1/4 of the field length
  const LW = 5;                 // field line thickness, CSS px
  const PAD = 15;               // canvas margin around the rink, room for the goal-line dots at full size

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const rink = document.getElementById('rink');
  const youEl = document.getElementById('you');
  const cpuEl = document.getElementById('cpu');

  let s = 100, ox = PAD, oy = PAD, dpr = 1;

  // ---- Colors: white on black ----
  const INK = '#000', LINE = '#fff';

  const phone = window.matchMedia('(max-width: 700px), (pointer: coarse)');
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const cw = rink.clientWidth, ch = rink.clientHeight;
    const aw = cw - 2 * PAD, ah = ch - 2 * PAD;
    const oldH = H;
    s = Math.max(20, Math.min(aw / W, ah / 3));
    // On phones the rink keeps its width and grows down into the spare height.
    H = phone.matches ? Math.max(3, Math.min(4.5, ah / s)) : 3;
    BASE = H - 0.28;
    LURCH = H / 4;
    if (oldH !== H) {
      ball.y *= H / oldH;
      player.y = BASE;
    }
    const pw = W * s + 2 * PAD, ph = H * s + 2 * PAD;
    canvas.style.width = pw + 'px';
    canvas.style.height = ph + 'px';
    canvas.width = Math.round(pw * dpr);
    canvas.height = Math.round(ph * dpr);
    ox = PAD; oy = PAD;
  }
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(rink);

  // ---- State ----
  const score = { you: 0, cpu: 0 };
  const player = { x: 1, y: BASE, vx: 0, vy: 0 };
  const opp = { x: 1, y: OPP_Y, vx: 0, vy: 0 };
  const ball = { x: 1, y: H / 2, vx: 0, vy: 0, live: false };
  let targetX = 1;
  let mode = 'mouse';
  const keys = { left: false, right: false };
  let shotStart = -10;          // clock time the current shot began
  const shotDir = { x: 0, y: -1 };  // unit vector toward the puck, fixed when the shot starts
  let homeX = 1;                // striker's resting x on the baseline
  let serveAt = 0.6;            // clock time of next serve
  let clock = 0;
  let aiErr = 0;

  // ---- Power-ups ----
  const PU_EVERY = 10;          // seconds between spawns
  const PU_TIME = 15;           // seconds each effect lasts
  const PU_MAX = 3;             // most on the field at once
  const PU_TYPES = ['small', 'big', 'wide'];           // powers with timed effects
  const SPAWN_TYPES = [...PU_TYPES, 'box'];           // box: releases three random power-ups
  const ALL_TYPES = [...SPAWN_TYPES, 'bolt'];         // what a box can release
  const powerups = [];          // { x, y, type, born }
  const bursts = [];            // { x, y, born }
  const PU_STACK = 3;           // most stacks of one power at once
  const fx = { small: [], big: [], wide: [] };   // end times, one per stacked pickup (soonest first)
  let nextSpawn = PU_EVERY;
  let credit = false;           // you touched the puck more recently than the opponent did
  let touch = null;             // which striker touched the puck last: 'you', 'opp' or null
  const RED = '#f2382c', BLUE = '#2f6df6';
  const FIRE_OUT = '#ff7a1a', FIRE_IN = '#ffd23a';
  const BOLT_CHANCE = 0.08;     // rare: about 1 spawn in 12
  const ROCKET_SPEED = 12;      // units/s for the last-resort straight shot (planned shots use 12-32)
  let armed = false;            // bolt collected: your next touch fires a rocket
  const BOLT_TIME = 2;          // seconds to use the bolt before it's wasted
  let armedUntil = 0;
  let rocketAt = 0;
  const trail = [];             // bolt shot lines { path, h: time of the hit }
  let gTop = GOAL, gBot = GOAL; // live goal half-widths (animated)
  let wideK = 1;                // striker width multiplier (animated)
  let movingTop = false, movingBot = false, reshaping = false;  // true while a shift is animating
  let dotTop = LW, dotBot = LW;  // goal-line end dot radii, px: 2x line thickness at rest, 4x while moving

  function spawnPowerup() {
    const lo = 0.65, hi = H - 0.65;
    for (let tries = 0; tries < 30; tries++) {
      const x = SR + 0.06 + Math.random() * (W - 2 * SR - 0.12);
      const y = lo + Math.random() * (hi - lo);
      if (Math.hypot(x - ball.x, y - ball.y) < 0.4) continue;
      if (powerups.some(p => Math.hypot(p.x - x, p.y - y) < SR * 2.6)) continue;
      if (powerups.length >= PU_MAX) powerups.shift();
      const type = Math.random() < BOLT_CHANCE ? 'bolt' : SPAWN_TYPES[Math.floor(Math.random() * SPAWN_TYPES.length)];
      powerups.push({ x, y, type, born: clock });
      return;
    }
  }

  // Lurch profile: snap forward, brief hold, ease back.
  // Shooting again before the return starts adds a second jump from the first one's peak,
  // aimed at the puck, half as far.
  const OUT = 0.32, HOLD = 0.12, BACK = 0.72;
  const OUT2 = OUT * 0.6;       // the shorter second jump takes a little less time
  let dbl = null;               // time (since shot start) the second jump begins, or null
  const shotDir2 = { x: 0, y: -1 };
  const easeOut = u => 1 - (1 - u) * (1 - u);
  const peakTime = () => (dbl === null ? OUT : dbl + OUT2);
  const shotEnd = () => peakTime() + HOLD + BACK;

  function aim(fromX, fromY, out) {
    const dx = ball.x - fromX, dy = ball.y - fromY, d = Math.hypot(dx, dy);
    if (d > 1e-6) { out.x = dx / d; out.y = dy / d; } else { out.x = 0; out.y = -1; }
  }

  // Striker offset from its baseline spot at clock time ta.
  function shotOffset(ta) {
    const t = ta - shotStart;
    if (t < 0 || t > shotEnd()) return [0, 0];
    const r1 = LURCH * easeOut(Math.min(1, t / OUT));
    let x = shotDir.x * r1, y = shotDir.y * r1;
    if (dbl !== null && t > dbl) {
      const r2 = (LURCH / 2) * easeOut(Math.min(1, (t - dbl) / OUT2));
      x += shotDir2.x * r2; y += shotDir2.y * r2;
    }
    const back = t - peakTime() - HOLD;
    if (back > 0) { const u = back / BACK, k = 1 - u * u * (3 - 2 * u); x *= k; y *= k; }
    return [x, y];
  }

  function shoot() {
    const t = clock - shotStart;
    if (t > shotEnd()) {
      aim(homeX, BASE, shotDir);
      shotStart = clock;
      dbl = null;
    } else if (dbl === null && t < OUT + HOLD) {
      dbl = Math.max(OUT, t);   // queued until the first jump peaks
      aim(homeX + shotDir.x * LURCH, BASE + shotDir.y * LURCH, shotDir2);
    }
  }

  // ---- Input ----
  function fieldX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left - ox) / s;
  }
  window.addEventListener('pointermove', e => {
    mode = 'mouse';
    targetX = fieldX(e.clientX);
  });
  let downAt = null;
  window.addEventListener('pointerdown', e => {
    targetX = fieldX(e.clientX);
    if (e.pointerType === 'mouse') { if (e.button === 0) shoot(); }
    else downAt = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', e => {
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 12) shoot();
    downAt = null;
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) shoot(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); keys.left = true; mode = 'key'; }
    else if (e.key === 'ArrowRight') { e.preventDefault(); keys.right = true; mode = 'key'; }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });

  // ---- Physics helpers ----
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Striker is an ellipse with half-width a and half-height SR (a circle when a = SR).
  function hitStriker(st, a) {
    const A = a + BR, B = SR + BR;
    const dx = ball.x - st.x, dy = ball.y - st.y;
    const q = (dx * dx) / (A * A) + (dy * dy) / (B * B);
    if (q >= 1 || q === 0) return false;
    const k = 1 / Math.sqrt(q);
    ball.x = st.x + dx * k; ball.y = st.y + dy * k;
    let nx = dx / (A * A), ny = dy / (B * B);
    const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    let rvx = ball.vx - st.vx, rvy = ball.vy - st.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      rvx -= 1.9 * vn * nx; rvy -= 1.9 * vn * ny;
      ball.vx = st.vx + rvx; ball.vy = st.vy + rvy;
      aiErr = (Math.random() - 0.5) * 0.14;
    }
    return true;
  }

  function hitPoint(px, py) {
    const dx = ball.x - px, dy = ball.y - py, d2 = dx * dx + dy * dy;
    if (d2 >= BR * BR || d2 === 0) return false;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
    ball.x = px + nx * BR; ball.y = py + ny * BR;
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) { ball.vx -= 1.85 * vn * nx; ball.vy -= 1.85 * vn * ny; }
    return true;
  }

  // Returns true if the puck touched a wall or goal post.
  function walls() {
    let hit = false;
    if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.92; hit = true; }
    if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.92; hit = true; }
    const dx = Math.abs(ball.x - 1);
    if (dx > gTop && ball.y < BR && ball.y > -BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.92; hit = true; }
    if (dx > gBot && ball.y > H - BR && ball.y < H + BR) { ball.y = H - BR; ball.vy = -Math.abs(ball.vy) * 0.92; hit = true; }
    if (hitPoint(1 - gTop, 0)) hit = true;
    if (hitPoint(1 + gTop, 0)) hit = true;
    if (hitPoint(1 - gBot, H)) hit = true;
    if (hitPoint(1 + gBot, H)) hit = true;
    return hit;
  }

  function collectPowerups() {
    const released = [];
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      if (clock - p.born < 0.25) continue;   // still popping in
      if (Math.hypot(ball.x - p.x, ball.y - p.y) >= SR + BR) continue;
      if (!credit) continue;
      if (p.type === 'box') {
        // Release three random power-ups (any kind, box and bolt included), evenly spaced around where the box was.
        const a0 = Math.random() * Math.PI * 2;
        [0, 1, 2].forEach(j => {
          const type = ALL_TYPES[Math.floor(Math.random() * ALL_TYPES.length)];
          const a = a0 + (j * Math.PI * 2) / 3;
          released.push({
            x: clamp(p.x + Math.cos(a) * 0.45, SR + 0.02, W - SR - 0.02),
            y: clamp(p.y + Math.sin(a) * 0.45, SR + 0.02, H - SR - 0.02),
            type, born: clock,
          });
        });
      } else {
        if (p.type === 'bolt') { armed = true; armedUntil = clock + BOLT_TIME; }
        else {
          fx[p.type].push(clock + PU_TIME);
          if (fx[p.type].length > PU_STACK) fx[p.type].shift();
        }
      }
      bursts.push({ x: p.x, y: p.y, born: clock });
      powerups.splice(i, 1);
    }
    powerups.push(...released);
  }

  // ---- Bolt shot ----
  // When the armed striker touches the puck, simulate candidate shots (straight, or banked off
  // either side wall, into points across the goal mouth, at a few speeds) against the opponent's
  // real movement, keep the one that scores with the most clearance, and fly the puck along it.
  const SIM_DT = 1 / 600;
  let rocketPath = null;        // flat [x0, y0, x1, y1, ...] sampled every SIM_DT

  function simRocket(vx, vy, gl) {
    let bx = ball.x, by = ball.y;
    let x = opp.x, v = opp.vx, target = opp.x;
    let margin = Infinity;
    const path = [bx, by];
    for (let n = 0; n < 1200; n++) {
      if (n % 10 === 0) {       // the opponent re-reads the puck once per frame
        let t = 1;
        if (vy < 0 && by > OPP_Y) t = clamp(predictFrom(bx, by, vx, vy) + aiErr, 1 - gTop - 0.28, 1 + gTop + 0.28);
        else if (by < H / 2) t = clamp(bx, 1 - gTop - 0.28, 1 + gTop + 0.28);
        target = clamp(t, SR, W - SR);
      }
      const acc = 80 * (target - x) - 8 * v;
      v = clamp(v + acc * SIM_DT, -1.7, 1.7);
      x = clamp(x + v * SIM_DT, SR, W - SR);
      bx += vx * SIM_DT; by += vy * SIM_DT;
      if (bx < BR) { bx = BR; vx = Math.abs(vx) * 0.92; }
      if (bx > W - BR) { bx = W - BR; vx = -Math.abs(vx) * 0.92; }
      if (by < BR && by > -BR && Math.abs(bx - 1) > gl - BR) return null;   // end wall or post
      if (by > H - BR) return null;
      margin = Math.min(margin, Math.hypot(bx - x, by - OPP_Y) - SR - BR);
      if (margin < 0.04) return null;   // the opponent could get a piece of it
      path.push(bx, by);
      if (by < -BR * 1.5) return { path, margin };
    }
    return null;
  }

  function planRocket() {
    // Plan against the narrower of the goal's current and target width, in case it is shrinking.
    const gl = Math.min(gTop, W / 2 - 0.02, GOAL * Math.pow(1.5, fx.big.length));
    const lo = 1 - gl + BR * 1.3, hi = 1 + gl - BR * 1.3;
    const span = W - 2 * BR;
    let best = null;
    for (let i = 0; i <= 12; i++) {
      const u = lo + ((hi - lo) * i) / 12 - BR;
      // Aim at mirror images of the target: straight, one bank off either wall, or two banks.
      for (const ax of [BR + u, BR - u, BR + 2 * span - u, BR + u + 2 * span, BR + u - 2 * span]) {
        const dx = ax - ball.x, dy = -ball.y, d = Math.hypot(dx, dy);
        if (d < 1e-6) continue;
        for (const sp of [12, 14, 16, 18, 20, 24, 28, 32]) {
          const r = simRocket((dx / d) * sp, (dy / d) * sp, gl);
          if (r && (!best || r.margin > best.margin)) best = r;
        }
      }
    }
    return best && best.path;
  }

  // Last resort only (no clean shot found): a straight line into the middle of the goal.
  function straightPath() {
    const path = [ball.x, ball.y];
    const dx = 1 - ball.x, dy = -BR * 2 - ball.y, d = Math.hypot(dx, dy) || 1;
    const steps = Math.ceil(d / (ROCKET_SPEED * SIM_DT));
    for (let n = 1; n <= steps; n++) path.push(ball.x + (dx * n) / steps, ball.y + (dy * n) / steps);
    return path;
  }

  function fireRocket(now) {
    armed = false;
    rocketPath = planRocket() || straightPath();
    ball.rocket = true;
    rocketAt = now;
    trail.push({ path: rocketPath, h: now });
  }

  // Move the puck along the planned path; past its end, the puck is in the net.
  function followRocket(now) {
    const p = rocketPath, last = p.length / 2 - 1;
    const k = Math.max(0, (now - rocketAt) / SIM_DT);
    const i = Math.min(last - 1, Math.floor(k)), f = Math.min(1, k - i);
    const x0 = p[2 * i], y0 = p[2 * i + 1], x1 = p[2 * i + 2], y1 = p[2 * i + 3];
    ball.x = x0 + (x1 - x0) * f;
    ball.y = y0 + (y1 - y0) * f;
    ball.vx = (x1 - x0) / SIM_DT;
    ball.vy = (y1 - y0) / SIM_DT;
    if (k >= last) ball.y = Math.min(ball.y, -BR * 2);
  }

  function predictFrom(bx, by, vx, vy) {
    const t = (by - OPP_Y) / -vy;
    const lo = BR, span = W - 2 * BR;
    let u = (bx + vx * t - lo) % (2 * span);
    if (u < 0) u += 2 * span;
    if (u > span) u = 2 * span - u;
    return lo + u;
  }
  const predictX = () => predictFrom(ball.x, ball.y, ball.vx, ball.vy);

  function goal(who) {
    score[who]++;
    render();
    const el = who === 'you' ? youEl : cpuEl;
    el.classList.add('bump');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('bump')));
    ball.live = false;
    ball.rocket = false;
    credit = false;
    touch = null;
    ball.x = 1; ball.y = H / 2; ball.vx = ball.vy = 0;
    serveAt = clock + 1.0;
  }

  function render() {
    youEl.textContent = score.you;
    cpuEl.textContent = score.cpu;
  }

  // ---- Simulation step ----
  function step(dt) {
    const t0 = clock;
    clock += dt;

    if (!ball.live && clock >= serveAt) {
      const a = (Math.random() - 0.5) * 0.8;
      ball.vx = Math.sin(a) * 1.1; ball.vy = Math.cos(a) * 1.1;
      ball.live = true;
    }

    if (armed && clock >= armedUntil) armed = false;   // bolt not used in time: wasted
    if (clock >= nextSpawn) { spawnPowerup(); nextSpawn = clock + PU_EVERY; }

    // Ease goal widths and striker width toward whatever the active effects call for.
    // Ease out toward the target, snapping once it's within a hair.
    const ease = (v, to, k) => { const n = v + (to - v) * (1 - Math.exp(-k * dt)); return Math.abs(to - n) < 0.002 ? to : n; };
    for (const k of PU_TYPES) while (fx[k].length && fx[k][0] <= clock) fx[k].shift();
    // Each stack compounds: goal halves again, their goal grows 1.5× again, striker gains 1× width.
    const gBotT = GOAL / Math.pow(2, fx.small.length);
    const gTopT = Math.min(W / 2 - 0.02, GOAL * Math.pow(1.5, fx.big.length));
    const wideT = 1 + fx.wide.length;
    gBot = ease(gBot, gBotT, 4);
    gTop = ease(gTop, gTopT, 4);
    wideK = ease(wideK, wideT, 7);
    movingBot = gBot !== gBotT;
    movingTop = gTop !== gTopT;
    const dk = 1 - Math.exp(-14 * dt);
    dotTop += ((movingTop ? 2 * LW : LW) - dotTop) * dk;
    dotBot += ((movingBot ? 2 * LW : LW) - dotBot) * dk;
    reshaping = wideK !== wideT;
    const pa = SR * wideK;

    if (mode === 'key') targetX += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 2.6 * dt;
    targetX = clamp(targetX, pa, W - pa);

    // Opponent: hold the goal mouth, read the ball, never strike.
    let aiTarget = 1;
    if (ball.live && ball.vy < 0 && ball.y > OPP_Y) aiTarget = clamp(predictX() + aiErr, 1 - gTop - 0.28, 1 + gTop + 0.28);
    else if (ball.live && ball.y < H / 2) aiTarget = clamp(ball.x, 1 - gTop - 0.28, 1 + gTop + 0.28);
    aiTarget = clamp(aiTarget, SR, W - SR);

    const N = 10, sdt = dt / N;
    for (let i = 1; i <= N; i++) {
      // player
      homeX = clamp(homeX + clamp(targetX - homeX, -7 * sdt, 7 * sdt), pa, W - pa);
      const off = shotOffset(t0 + sdt * i);
      const nx = clamp(homeX + off[0], pa, W - pa);
      const ny = clamp(BASE + off[1], SR, H - SR);
      player.vx = (nx - player.x) / sdt; player.vy = (ny - player.y) / sdt;
      player.x = nx; player.y = ny;

      // opponent
      // Underdamped spring toward the target: it overshoots a little, then corrects.
      const acc = 80 * (aiTarget - opp.x) - 8 * opp.vx;
      opp.vx = clamp(opp.vx + acc * sdt, -1.7, 1.7);
      opp.vy = 0;
      opp.x += opp.vx * sdt;
      if (opp.x < SR) { opp.x = SR; opp.vx = 0; }
      if (opp.x > W - SR) { opp.x = W - SR; opp.vx = 0; }

      if (ball.live) {
        const now = t0 + sdt * i;
        if (ball.rocket) {
          followRocket(now);    // planned bolt shot: the path already accounts for walls and the opponent
        } else {
          ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;
          if (hitStriker(player, pa)) {
            credit = true; touch = 'you';
            if (armed) fireRocket(now);
          }
          if (!ball.rocket) {
            if (hitStriker(opp, SR)) { credit = false; touch = 'opp'; }
            walls();            // wall bounces keep whoever touched it last
          }
        }
        collectPowerups();
      }
    }

    while (trail.length && clock - trail[0].h > 3) trail.shift();

    if (ball.live && ball.rocket) {
      if (clock - rocketAt > 2.5) ball.rocket = false;   // safety net; it scores long before this
    } else if (ball.live) {
      // Light air drag, a speed ceiling, and a floor so the puck never parks out of reach.
      const f = Math.pow(0.66, dt);
      ball.vx *= f; ball.vy *= f;
      let sp = Math.hypot(ball.vx, ball.vy);
      if (sp > 9) { ball.vx *= 9 / sp; ball.vy *= 9 / sp; }
      if (Math.abs(ball.vy) < 0.3) ball.vy = (ball.vy < 0 ? -0.3 : 0.3);
      sp = Math.hypot(ball.vx, ball.vy);
      if (sp < 0.6) { ball.vx *= 0.6 / sp; ball.vy *= 0.6 / sp; }
    }

    if (ball.live) {
      if (ball.y < -BR * 1.5) goal('you');
      else if (ball.y > H + BR * 1.5) goal('cpu');
    }
  }

  // ---- Drawing ----
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = LW;
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'butt';

    // Boundary drawn just outside the playing surface so its inner edge is the wall.
    const h = LW / 2;
    const L = ox - h, R = ox + W * s + h, T = oy - h, B = oy + H * s + h;
    const tl = ox + (1 - gTop) * s, tr = ox + (1 + gTop) * s;
    const bl = ox + (1 - gBot) * s, br = ox + (1 + gBot) * s;
    ctx.beginPath();
    ctx.moveTo(tl, T); ctx.lineTo(L, T); ctx.lineTo(L, B); ctx.lineTo(bl, B);
    ctx.moveTo(tr, T); ctx.lineTo(R, T); ctx.lineTo(R, B); ctx.lineTo(br, B);
    ctx.stroke();

    // Dots on the goal-line ends: twice the line thickness, growing to four times while the goal resizes.
    const dot = (x, y, r) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = LINE;
      ctx.fill();
    };
    dot(tl, T, dotTop); dot(tr, T, dotTop);
    dot(bl, B, dotBot); dot(br, B, dotBot);
    ctx.lineWidth = LW;

    // Halfway line
    ctx.beginPath();
    ctx.moveTo(ox, oy + (H / 2) * s); ctx.lineTo(ox + W * s, oy + (H / 2) * s);
    ctx.stroke();

    // Power-ups: pop in on spawn, ring out when collected.
    for (const p of powerups) {
      const u = Math.min(1, (clock - p.born) / 0.25);
      const pop = u < 1 ? 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2) : 1;
      drawIcon(ctx, p.type, ox + p.x * s, oy + p.y * s, SR * s * pop, LW, true);
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i], u = (clock - b.born) / 0.4;
      if (u >= 1) { bursts.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - u;
      ctx.lineWidth = LW;
      ctx.beginPath();
      ctx.arc(ox + b.x * s, oy + b.y * s, SR * s * (1 + u * 1.2), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Aim line from your striker to the puck.
    ctx.globalAlpha = 0.1;
    ctx.lineWidth = LW;
    ctx.beginPath();
    ctx.moveTo(ox + player.x * s, oy + player.y * s);
    ctx.lineTo(ox + ball.x * s, oy + ball.y * s);
    ctx.stroke();
    ctx.globalAlpha = 1;

    drawTrail();
    drawStriker(opp, SR, BLUE);
    if (armed) drawFire(player, SR * wideK);
    drawStriker(player, SR * wideK, RED);

    // Puck takes the color of whichever striker touched it last.
    ctx.fillStyle = touch === 'you' ? RED : touch === 'opp' ? BLUE : LINE;
    ctx.beginPath();
    ctx.arc(ox + ball.x * s, oy + ball.y * s, BR * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // Flickering ring of flame tongues around the striker's edge, at most 10px tall.
  function drawFire(st, a) {
    const cx = ox + st.x * s, cy = oy + st.y * s;
    const rx = a * s, ry = SR * s, n = 18, half = (Math.PI / n) * 1.15;
    const edge = th => [cx + Math.cos(th) * rx, cy + Math.sin(th) * ry];
    const life = 0.3 + 0.7 * clamp((armedUntil - clock) / BOLT_TIME, 0, 1);   // flames shrink as time runs out
    for (const [col, scale] of [[FIRE_OUT, 1], [FIRE_IN, 0.55]]) {
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const th = (i / n) * Math.PI * 2 + clock * 0.9;
        const h = scale * life * (6 + 4 * Math.sin(clock * 17 + i * 2.3) * Math.sin(clock * 7.3 + i * 1.1));
        let nx = Math.cos(th) / rx, ny = Math.sin(th) / ry;
        const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
        const m = edge(th), p = edge(th - half), q = edge(th + half);
        ctx.moveTo(p[0], p[1]);
        ctx.lineTo(m[0] + nx * h, m[1] + ny * h);
        ctx.lineTo(q[0], q[1]);
        ctx.lineTo(p[0], p[1]);
      }
      ctx.fill();
    }
  }

  // A plain red 5px line along each bolt shot's path, drawn as the puck travels
  // and fading out evenly over the 3 seconds after the hit.
  function drawTrail() {
    ctx.save();
    ctx.strokeStyle = RED;
    ctx.lineWidth = LW;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const shot of trail) {
      const k = 1 - (clock - shot.h) / 3;
      if (k <= 0) continue;
      const p = shot.path, pts = p.length / 2;
      const upto = Math.min(pts, Math.floor((clock - shot.h) / SIM_DT) + 1);
      if (upto < 2) continue;
      ctx.globalAlpha = k;
      ctx.beginPath();
      ctx.moveTo(ox + p[0] * s, oy + p[1] * s);
      for (let i = 1; i < upto; i++) ctx.lineTo(ox + p[2 * i] * s, oy + p[2 * i + 1] * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Solid, no outline: red for you, blue for the opponent.
  function drawStriker(st, a, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(ox + st.x * s, oy + st.y * s, a * s, SR * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Power-up symbol. With ring = true it is drawn inside its own circle.
  //   small: chevrons pointing in (your goal shrinks)
  //   big:   chevrons pointing out (their goal widens)
  //   wide:  a flat ellipse (your striker stretches)
  //   box:   an isometric cube (releases three random power-ups)
  //   bolt:  a lightning bolt (rare; your next touch is a guaranteed goal)
  function drawIcon(c, type, cx, cy, r, lw, ring) {
    if (r <= lw) return;        // too small to draw yet (start of the pop-in)
    c.save();
    c.strokeStyle = LINE;
    c.fillStyle = INK;
    c.lineWidth = lw;
    c.lineJoin = 'miter';
    c.lineCap = 'butt';
    if (ring) {
      c.beginPath(); c.arc(cx, cy, r - lw / 2, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    const h = r * 0.3;
    c.beginPath();
    if (type === 'small') {
      c.moveTo(cx - r * 0.56, cy - h); c.lineTo(cx - r * 0.18, cy); c.lineTo(cx - r * 0.56, cy + h);
      c.moveTo(cx + r * 0.56, cy - h); c.lineTo(cx + r * 0.18, cy); c.lineTo(cx + r * 0.56, cy + h);
    } else if (type === 'big') {
      c.moveTo(cx - r * 0.18, cy - h); c.lineTo(cx - r * 0.56, cy); c.lineTo(cx - r * 0.18, cy + h);
      c.moveTo(cx + r * 0.18, cy - h); c.lineTo(cx + r * 0.56, cy); c.lineTo(cx + r * 0.18, cy + h);
    } else if (type === 'wide') {
      c.ellipse(cx, cy, r * 0.56, r * 0.24, 0, 0, Math.PI * 2);
    } else if (type === 'bolt') {
      c.miterLimit = 3;
      c.moveTo(cx + r * 0.16, cy - r * 0.6);
      c.lineTo(cx - r * 0.22, cy + r * 0.05);
      c.lineTo(cx + r * 0.22, cy - r * 0.05);
      c.lineTo(cx - r * 0.16, cy + r * 0.6);
    } else {
      // Isometric cube: hexagon outline plus the three inner edges meeting at the centre.
      const R = r * 0.5;
      const v = deg => [cx + R * Math.cos(deg * Math.PI / 180), cy + R * Math.sin(deg * Math.PI / 180)];
      const hex = [-90, -30, 30, 90, 150, 210].map(v);
      c.moveTo(hex[0][0], hex[0][1]);
      for (let i = 1; i < 6; i++) c.lineTo(hex[i][0], hex[i][1]);
      c.lineTo(hex[0][0], hex[0][1]);
      c.lineTo(hex[1][0], hex[1][1]);   // overlap the start so the top corner gets a clean miter
      for (const k of [1, 3, 5]) { c.moveTo(cx, cy); c.lineTo(hex[k][0], hex[k][1]); }
    }
    c.stroke();
    c.restore();
  }

  // ---- Loop ----
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop); // queue the next frame first so one bad frame can't stop the game
    const dt = last ? Math.min(0.033, (t - last) / 1000) : 0;
    last = t;
    try {
      if (dt > 0) step(dt);
      draw();
    } catch (e) {
      console.error(e);
    }
  }

  function start(data) {
    if (data && typeof data.you === 'number') score.you = data.you;
    if (data && typeof data.cpu === 'number') score.cpu = data.cpu;
    render();
    resize();
    requestAnimationFrame(loop);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ you: score.you, cpu: score.cpu }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
