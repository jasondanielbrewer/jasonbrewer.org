    flightQ.normalize();

    fwd.set(0, 0, -1).applyQuaternion(flightQ);
    // Thrust pulls velocity back toward the nose direction at cruise speed; planets pull it aside
    vel.lerp(tmpV.copy(fwd).multiplyScalar(cruise), 1 - Math.exp(-1.3 * dt));
    placePlanets(t);
    if (opt.planets) planetGravity(dt);
    pos.addScaledVector(vel, dt);

    // Ship orientation (visual bank on the mesh)
    shipMesh.rotation.set(pitchRate * 0.15, 0, -bank);

    // Asteroids: wrap around the ship and rotate, then collide
    for (let i = 0; i < activeAst; i++) {
      const a = asteroids[i], am = a.mesh;
      am.position.set(pos.x + wrap(a.base.x, pos.x, ABOX), pos.y + wrap(a.base.y, pos.y, ABOX), pos.z + wrap(a.base.z, pos.z, ABOX));
      am.quaternion.setFromAxisAngle(a.axis, a.phase + t * a.spin);
    }
    updateOrbs(dt);
    collide();
    if (level === 2 && tunnels && tunnelProbe(pos) === Infinity) spawnInTunnels(); // escaped: start again
    updateFlashes(dt);
    updateLasers(dt);

    shipRoot.position.copy(pos);
    shipRoot.quaternion.copy(flightQ);
    shipMat.emissive.setRGB(flash, flash * 0.35, flash * 0.25);
    flash *= Math.exp(-4 * dt);

    // Chase cam (far)
    camQ.slerp(flightQ, 1 - Math.exp(-5 * dt));
    camOff.set(0, CAM_Y, CAM_Z).multiplyScalar(camScale).applyQuaternion(camQ);
    camera.position.copy(pos).add(camOff);
    qRoll.setFromAxisAngle(Z, -bank * 0.25);
    camera.quaternion.copy(camQ).multiply(qRoll);
    if (shake > 0.002) {
      camera.position.x += (Math.random() - .5) * shake;
      camera.position.y += (Math.random() - .5) * shake;
      camera.position.z += (Math.random() - .5) * shake;
      shake *= Math.exp(-5 * dt);
    }
    // Keep the chase camera outside planets when skimming low
    if (opt.planets) for (const p of planets) {
      pg.subVectors(camera.position, p.group.position);
      const r = pg.length(), minR = p.R + 3;
      if (r < minR && r > 1e-3) camera.position.copy(p.group.position).addScaledVector(pg, minR / r);
    }
    // In the tunnels, pull the chase camera in toward the ship until it's safely inside
    if (level === 2 && tunnels && tunnelProbe(camera.position) > -2) {
      camOff.subVectors(camera.position, pos);
      let lo = 0, hi = 1;
      for (let i = 0; i < 8; i++) {
        const mid = (lo + hi) / 2;
        if (tunnelProbe(tmpV.copy(pos).addScaledVector(camOff, mid)) < -2) lo = mid; else hi = mid;
      }
      camera.position.copy(pos).addScaledVector(camOff, lo);
    }

    starfield.position.copy(camera.position); // sky stays at infinity
    updateExhaust(dt, t);
    updateTrails(dt, t);
    const du = dustMat.uniforms;
    du.uCenter.value.copy(pos);                         // the shader wraps the dust around this point
    du.uTime.value = t;                                 // drift and twinkle
    du.uStreakK.value = teleported ? 0 : streakSec / Math.max(dt, 1 / 240); // no streak across a teleport
    teleported = false;
    updateSpeedo();
    if (whiteFlash > 0.003) {                           // orb pickup: full-screen white, fading over ~0.5 s
      whiteFlashEl.style.opacity = whiteFlash.toFixed(3);
      whiteFlash *= Math.exp(-5 * dt);
    } else if (whiteFlash) { whiteFlash = 0; whiteFlashEl.style.opacity = '0'; }
  }

  // ---------- Speedometer (0–100 UPS): fill arc = target speed, needle + number = actual speed ----------
  // Set the target by dragging around the dial, scrolling anywhere over the game, or with the arrow keys.
  const speedo = document.getElementById('speedo');
  const SC = 66, SR = 54, A0 = 135, SWEEP = 270;                 // dial centre, radius, start angle, sweep (deg)
  const ang = v => A0 + SWEEP * v / MAX_SPEED;                     // value → screen angle (clockwise, y down)
  const pt = (a, r) => [SC + r * Math.cos(a * Math.PI / 180), SC + r * Math.sin(a * Math.PI / 180)];
  const arc = (a1, a2, r) => {
    const [x1, y1] = pt(a1, r), [x2, y2] = pt(a2, r);
    return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };
  let ticks = '';
  for (let v = 0; v <= MAX_SPEED; v += 10) {
    const major = v % 50 === 0, [x1, y1] = pt(ang(v), SR - 9), [x2, y2] = pt(ang(v), SR - (major ? 17 : 13));
    ticks += `<line class="tick${major ? ' major' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (major) { const [lx, ly] = pt(ang(v), SR - 25); ticks += `<text class="lbl" x="${lx}" y="${ly}">${v}</text>`; }
  }
  speedo.innerHTML = `<svg viewBox="0 0 132 132">
    <path class="track" d="${arc(A0, A0 + SWEEP, SR)}"/><path class="fill"/>${ticks}
    <line class="needle" x1="${SC}" y1="${SC}" x2="${SC + SR - 12}" y2="${SC}"/><circle class="hub" cx="${SC}" cy="${SC}" r="3.5"/>
    <text class="val" x="${SC}" y="${SC + 41}">0</text><text class="unit" x="${SC}" y="${SC + 53}">UPS</text></svg>`;
  const fillEl = speedo.querySelector('.fill'), needleEl = speedo.querySelector('.needle'), valEl = speedo.querySelector('.val');

  function setCruise(v) {
    cruise = THREE.MathUtils.clamp(Math.round(v * 2) / 2, 0, MAX_SPEED);
    fillEl.setAttribute('d', cruise > 0.25 ? arc(A0, ang(cruise), SR) : '');
    speedo.setAttribute('aria-valuenow', String(Math.round(cruise)));
  }
  let shownSpeed = -1;
  function updateSpeedo() {                                         // actual speed along any direction
    const s = vel.length();
    needleEl.setAttribute('transform', `rotate(${ang(Math.min(s, MAX_SPEED * 1.05))} ${SC} ${SC})`);
    const r = Math.round(s);
    if (r !== shownSpeed) { valEl.textContent = r; shownSpeed = r; }
  }

  // Drag around the dial: the pointer's angle from the centre sets the target
  let speedDrag = null;
  const speedFromPointer = e => {
    const b = speedo.getBoundingClientRect(), k = 132 / b.width;
    let a = Math.atan2((e.clientY - b.top) * k - SC, (e.clientX - b.left) * k - SC) * 180 / Math.PI;
    if (a < 90) a += 360;                                           // unwrap so the dial runs 135° → 405°
    setCruise((a - A0) / SWEEP * MAX_SPEED);                        // the gap at the bottom clamps to 0 or 100
  };
  speedo.addEventListener('pointerdown', e => {
    speedDrag = e.pointerId; speedo.setPointerCapture(e.pointerId); speedFromPointer(e); e.preventDefault();
  });
  speedo.addEventListener('pointermove', e => { if (e.pointerId === speedDrag) speedFromPointer(e); });
  const endSpeedDrag = e => { if (e.pointerId === speedDrag) speedDrag = null; };
  speedo.addEventListener('pointerup', endSpeedDrag);
  speedo.addEventListener('pointercancel', endSpeedDrag);

  // Scroll anywhere over the game (not the panel): up = faster
  addEventListener('wheel', e => {
    if (e.target.closest && e.target.closest('#ui')) return;
    const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    setCruise(cruise - px * 0.05);
    e.preventDefault();
  }, { passive: false });

  // Arrow keys: up/right faster, down/left slower (hold Shift for steps of 10)
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('#ui')) return;      // leave the panel's sliders their keys
    if (e.code === 'Space') { firing.key = true; e.preventDefault(); return; }   // hold to fire
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setCruise(cruise + step);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setCruise(cruise - step);
    else return;
    e.preventDefault();
  });
  addEventListener('keyup', e => { if (e.code === 'Space') firing.key = false; });
  setCruise(cruise);

  // ---------- Levels ----------
  let teleported = false;                               // skip dust streaks for the frame after a jump
  const FWD0 = new THREE.Vector3(0, 0, -1);
  function spawnInTunnels() {
    const sp = tunnels.spawn;
    pos.copy(sp.p);
    flightQ.setFromUnitVectors(FWD0, sp.dir);
    vel.copy(sp.dir).multiplyScalar(cruise);
    angVel.set(0, 0, 0);
    bank = 0; pitchRate = 0;
    camQ.copy(flightQ);
    trails.forEach(r => { r.pts.length = 0; r.g.setDrawRange(0, 0); });
    exhaustFresh = true;
    teleported = true;
  }
  // Level 1: open space with asteroids, planets and sky. Level 2: a new tunnel network each time
  // it's chosen; asteroids, planets and sky are put away until you return to Level 1.
  function setLevel(n) {
    level = n;
    if (n === 2) {
      buildTunnels();
      setDensity(0, pos);
      setPlanetCount(0, pos);
      spawnInTunnels();
      setOrbCount(orbCount);                            // hides them while in the tunnels
    } else {
      if (tunnels) tunnels.group.visible = false;
      setDensity(curve(densityEl, MAX_AST), pos);
      setPlanetCount(+planetEl.value, pos);
      setOrbCount(orbCount);
    }
    applyOpts();
    document.querySelectorAll('.lvl').forEach(b => b.setAttribute('aria-checked', +b.dataset.level === n ? 'true' : 'false'));
  }
  document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.level)));

  // ---------- Black & white, inside the renderer ----------
  // After the scene is drawn, copy the screen into a texture and redraw it in greyscale. The depth
  // buffer is left untouched, so the coloured dust pass that follows is still hidden behind rocks.
  const bwSize = new THREE.Vector2();
  let bwTex = null;
  const bwMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; varying vec2 vUv;
      void main() {
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        gl_FragColor = vec4(vec3(dot(c, vec3(0.2126, 0.7152, 0.0722))), 1.0);
      }`,
    depthTest: false, depthWrite: false
  });
  const bwQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bwMat);
  bwQuad.frustumCulled = false;
  const bwScene = new THREE.Scene(), bwCam = new THREE.Camera();
  bwScene.add(bwQuad);
  const sizeBW = () => {                                  // texture matches the drawing buffer
    renderer.getDrawingBufferSize(bwSize);
    if (bwTex && bwTex.image.width === bwSize.x && bwTex.image.height === bwSize.y) return;
    if (bwTex) bwTex.dispose();
    bwTex = new THREE.DataTexture(null, bwSize.x, bwSize.y, THREE.RGBFormat);
    bwTex.minFilter = bwTex.magFilter = THREE.NearestFilter;
    bwTex.generateMipmaps = false;
    bwMat.uniforms.tDiffuse.value = bwTex;
  };
  sizeBW();
  const origin2 = new THREE.Vector2();

  // ---------- Film grain (final pass over the whole frame) ----------
  // White-noise static on a grain grid (~1 CSS px), Gaussian-blurred per pixel with a weighted 3×3
  // neighbourhood at two grain sizes, so it reads as soft organic grain rather than hard pixel noise.
  // Monochrome, strongest in the mid-tones and faint in the blacks, re-rolled 24 times a second.
  const grainMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uAmount: { value: 0 }, uSeed: { value: 0 }, uCell: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uAmount, uSeed, uCell; varying vec2 vUv;
      float h(vec2 p) {                                   // white noise per grain cell
        p = fract(p * vec2(0.1031, 0.1030) + uSeed);
        p += dot(p, p.yx + 33.33);
        return fract((p.x + p.y) * p.x);
      }
      float blurred(vec2 q) {                             // 3×3 Gaussian (1-2-1) of the static
        vec2 c = floor(q);
        float s = 4.0 * h(c);
        s += 2.0 * (h(c + vec2(1.0, 0.0)) + h(c - vec2(1.0, 0.0)) + h(c + vec2(0.0, 1.0)) + h(c - vec2(0.0, 1.0)));
        s += h(c + vec2(1.0, 1.0)) + h(c + vec2(-1.0, 1.0)) + h(c + vec2(1.0, -1.0)) + h(c - vec2(1.0, 1.0));
        return s / 16.0;
      }
      void main() {
        vec3 col = texture2D(tDiffuse, vUv).rgb;
        vec2 q = gl_FragCoord.xy / uCell;
        float n = 0.65 * blurred(q) + 0.35 * blurred(q * 0.5 + 17.0) - 0.5;   // two grain sizes, centred on 0
        float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
        float resp = 0.35 + 0.65 * 4.0 * l * (1.0 - l);   // film grain peaks in the mid-tones
        gl_FragColor = vec4(col + n * 2.4 * uAmount * resp * 0.35, 1.0);
      }`,
    depthTest: false, depthWrite: false
  });
  const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
  grainQuad.frustumCulled = false;
  const grainScene = new THREE.Scene();
  grainScene.add(grainQuad);

  // ---------- Loop ----------
  let last = performance.now(), simTime = 0, paused = false;
  // Two play/pause buttons (panel and game corner) share one state
  const playBtns = [document.getElementById('play'), document.getElementById('gplay')];
  const setPaused = p => {
    paused = p;
    for (const b of playBtns) { b.classList.toggle('paused', p); b.setAttribute('aria-label', p ? 'Play' : 'Pause'); }
  };
  for (const b of playBtns) b.addEventListener('click', () => setPaused(!paused));
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const stepped = !paused;
    if (stepped) {
      simTime += dt; step(dt, simTime);
      dustMat.uniforms.uPrevVP.value.copy(prevVP); // dust streaks run back to last frame's view
    }
    // Pass 1: sky, stars, planets with a long-range camera. Pass 2: everything near, on top,
    // with planet depth proxies so nearby planets still hide what's behind them.
    farCam.position.copy(camera.position);
    farCam.quaternion.copy(camera.quaternion);
    renderer.clear();
    renderer.render(farScene, farCam);
    renderer.clearDepth();
    renderer.render(scene, camera);
    if (opt.bw) {                                       // greyscale everything drawn so far
      renderer.copyFramebufferToTexture(origin2, bwTex);
      renderer.render(bwScene, bwCam);
    }
    for (const f of flashes) if (f.mesh.visible) {      // flashes follow their asteroid's current pose
      f.mesh.matrix.copy(f.ast.mesh.matrixWorld);
      f.mesh.matrixWorldNeedsUpdate = true;
    }
    camera.layers.set(1);                               // asteroid edge lines only, in their own colour
    renderer.render(scene, camera);
    camera.layers.set(0);
    renderer.render(flashScene, camera);                // face flashes in their own colour
    renderer.render(orbScene, camera);                  // orbs in their own colour
    renderer.render(laserScene, camera);                // laser bolts in their own colour
    renderer.render(shipScene, camera);                 // ship in its own colour (depth still hides it behind rocks)
    renderer.render(dustScene, camera);                 // dust last, in its own colour
    if (grainAmt > 0) {                                 // film grain over everything (keeps running while paused)
      const g = grainMat.uniforms;
      renderer.copyFramebufferToTexture(origin2, bwTex);
      g.tDiffuse.value = bwTex;
      g.uAmount.value = grainAmt;
      g.uSeed.value = (Math.floor(now / 1000 * 24) * 0.6180339) % 1;   // 24 grain frames per second
      g.uCell.value = renderer.getPixelRatio();         // grain ~1 CSS pixel on any screen
      renderer.render(grainScene, bwCam);
    }
    // Remember this view for next frame's streaks (frozen while paused, so streaks hold still)
    if (stepped) prevVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    requestAnimationFrame(frame);
  }
  step(0.016, 0);
  camQ.copy(flightQ);
  camera.updateMatrixWorld();
  prevVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  requestAnimationFrame(frame);

  // Refit to the game area whenever it changes (window resize, panel open/close or drag),
  // at most once per frame
  let fitQueued = false;
  function fitGame() {
    fitQueued = false;
    const w = gameW(), h = gameH();
    camera.aspect = farCam.aspect = w / h;
    camera.updateProjectionMatrix();
    farCam.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    edgeMat.resolution.set(w, h);
    laserCore.resolution.set(w, h);
    laserGlow.resolution.set(w, h);
    setPScale();
    sizeBW();
    sizeBound();
  }
  new ResizeObserver(() => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitGame); } }).observe(gameEl);
})();
</script>
</body>
</html>
